<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191b20">
<meta name="color-scheme" content="dark">
<title>天际巡航 · SKY PATROL</title>
<style>
  :root {
    color-scheme: dark;
    --page: oklch(0.22 0.009 270);
    --surface: oklch(0.265 0.009 270);
    --line: oklch(0.39 0.009 270);
    --ink: oklch(0.92 0.025 79);
    --muted: oklch(0.75 0.015 79);
    --accent: oklch(0.82 0.105 66);
    --hud: rgb(28 29 31 / 89%);
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --z-canvas: 1;
    --z-hud: 2;
    --z-modal: 3;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    overflow: hidden;
    background: var(--page);
    color: var(--ink);
    font: 13px/1.5 var(--sans);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  [hidden] { display: none !important; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button {
    min-height: 40px;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 9px 13px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    line-height: 1.25;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 160ms ease-out, border-color 160ms ease-out;
  }
  button:not(:disabled):hover { border-color: var(--accent); background: oklch(0.32 0.016 70); }
  button:not(:disabled):active { background: oklch(0.37 0.025 70); }
  button:disabled { cursor: wait; color: var(--muted); }
  button:focus-visible, a:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 4px;
  }
  button svg, a svg { flex: none; }
  a { color: var(--muted); text-underline-offset: 4px; }
  a:hover { color: var(--ink); }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  #sky-app {
    height: 100%;
    height: 100svh;
    min-width: 0;
    display: grid;
    grid-template-rows: 44px minmax(0, 1fr) auto;
    gap: 16px;
    padding: max(16px, env(safe-area-inset-top)) max(40px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(40px, env(safe-area-inset-left));
  }
  #sky-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-width: 0; }
  .sky-masthead { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .sky-pilot { display: block; width: 40px; height: 32px; image-rendering: pixelated; }
  .sky-masthead-name { font: 14px/1 var(--mono); letter-spacing: 1.2px; white-space: nowrap; }
  .sky-header-actions { display: flex; align-items: center; gap: 8px; }
  .sky-header-actions button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 11px; font-size: 11px; }
  #sky-sound { min-width: 112px; }
  #sky-fullscreen { width: 40px; padding: 9px; }
  #stage {
    position: relative;
    isolation: isolate;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid oklch(0.5 0.016 66);
    background: oklch(0.19 0.012 235);
    clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: var(--z-hud);
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgb(255 232 195 / 9%);
  }
  #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #gl { z-index: var(--z-canvas); }
  #ui { z-index: var(--z-hud); pointer-events: none; }
  #sky-app[data-mode="play"] #stage, #sky-app[data-mode="dying"] #stage { cursor: none; }
  #sky-brand {
    position: absolute;
    top: 48px;
    left: 40px;
    z-index: var(--z-hud);
    width: min(360px, 34vw);
    max-width: calc(100% - 64px);
    pointer-events: none;
    color: #fff0d5;
    text-shadow: 0 2px 0 rgb(46 32 35 / 70%);
  }
  #sky-mode-label {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 9px;
    font: 10px/1.4 var(--mono);
    letter-spacing: 1.2px;
  }
  #sky-mode-label::before { content: ""; width: 23px; height: 3px; background: #ffda9d; box-shadow: 0 2px 0 rgb(78 45 39 / 60%); }
  .sky-title { margin: 0; font-size: inherit; line-height: 0; }
  .sky-wordmark { display: block; width: 100%; height: auto; overflow: visible; image-rendering: pixelated; }
  .sky-brand-cn { margin: 10px 0 0 7px; font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: 6px; }
  .sky-location { display: flex; align-items: center; gap: 7px; margin: 12px 0 0 7px; font-size: 11px; line-height: 1.6; letter-spacing: 1px; white-space: nowrap; }
  .sky-location svg { flex: none; width: 12px; height: 14px; }
  #sky-start { display: flex; flex-wrap: wrap; gap: 9px; margin: 22px 0 0 7px; pointer-events: auto; text-shadow: none; }
  #sky-start button { min-height: 42px; padding: 11px 15px; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
  #sky-start .sky-primary { display: inline-flex; align-items: center; gap: 13px; }
  .sky-primary { border-color: #f8d69e; background: #f7cd90; color: #322720; box-shadow: 2px 2px 0 #744d3c; }
  .sky-primary:disabled { color: #684d34; }
  .sky-primary:not(:disabled):hover { background: #ffe1aa; border-color: #fff0ce; }
  .sky-primary:not(:disabled):active { background: #e8b375; }
  #sky-cruise { background: rgb(28 29 31 / 86%); border-color: rgb(255 231 195 / 57%); color: #fff0d5; }
  #sky-cruise:disabled { color: #d4c3aa; }
  #sky-cruise:not(:disabled):hover { background: #393530; }
  #sky-telemetry {
    position: absolute;
    left: 26px;
    bottom: 18px;
    z-index: var(--z-hud);
    display: flex;
    align-items: center;
    gap: 13px;
    min-height: 32px;

    font: 10px/1.4 var(--mono);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .sky-reading { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
  .sky-reading + .sky-reading { border-left: 1px solid rgb(255 232 195 / 25%); padding-left: 13px; }
  .sky-reading-label { color: #d1c5b6; font-size: 9px; }
  .sky-reading b { font-weight: 700; font-size: 11px; }
  .sky-unit { font-size: 9px; }
  #sky-camera {
    position: absolute;
    right: 26px;
    bottom: 18px;
    z-index: var(--z-hud);
    min-height: 40px;
    padding: 10px 12px 10px 32px;
    border-color: rgb(255 232 195 / 28%);
    background: var(--hud);
    color: #ffecd0;
    font: 11px/1.4 var(--mono);
    cursor: pointer;
  }
  #sky-camera::before {
    content: "";
    position: absolute;
    top: 15px;
    left: 12px;
    width: 10px;
    height: 8px;
    border: 2px solid #efc28b;
    border-radius: 1px;
  }
  #sky-camera::after { content: ""; position: absolute; top: 13px; left: 15px; width: 4px; height: 2px; background: #efc28b; }
  #sky-combat {
    position: absolute;
    top: 23px;
    right: 26px;
    z-index: var(--z-hud);
    display: grid;
    grid-template-columns: auto auto;
    column-gap: 19px;
    row-gap: 5px;
    padding: 9px 12px;
    border: 1px solid rgb(255 232 195 / 23%);
    background: var(--hud);
    color: #ffe8c5;
    font: 11px/1.5 var(--mono);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .sky-combat-reading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; white-space: nowrap; }
  .sky-combat-reading > span { color: #d1c5b6; font: 9px/1.5 var(--sans); }
  .sky-combat-reading b { font-weight: 600; }
  #bootfallback {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: var(--z-hud);
    transform: translate(-50%, -50%);
    max-width: calc(100% - 32px);
    border: 1px solid rgb(255 232 195 / 25%);
    padding: 12px 18px;
    background: var(--hud);
    color: #ffdfac;
    font: 12px/1.7 var(--sans);
    text-align: center;
    pointer-events: none;
  }
  .sky-modal {
    position: absolute;
    inset: 0;
    z-index: var(--z-modal);
    display: grid;
    place-items: center;
    overflow: auto;
    padding: 24px;
    background: rgb(18 20 23 / 73%);
    cursor: auto;
  }
  .sky-dialog {
    width: min(100%, 350px);
    border: 1px solid #796c5c;
    padding: 29px 26px 26px;
    background: #23262b;
    color: #f5e8d4;
    box-shadow: 5px 5px 0 rgb(12 14 17 / 65%);
  }
  .sky-dialog h2 { margin: 0 0 7px; font-size: 25px; font-weight: 600; line-height: 1.35; letter-spacing: 3px; text-wrap: balance; }
  .sky-dialog p { margin: 0 0 22px; color: #cbbfab; font-size: 12px; line-height: 1.8; text-wrap: pretty; }
  .sky-dialog-actions { display: grid; gap: 10px; }
  .sky-dialog-actions button { min-height: 44px; }
  .sky-dialog-secondary { display: flex; gap: 10px; }
  .sky-dialog-secondary button { flex: 1; }
  .sky-result-readings { display: flex; gap: 35px; margin: 23px 0 26px; }
  .sky-result-readings div { display: grid; gap: 5px; }
  .sky-result-readings dt { color: #cbbfab; font-size: 11px; }
  .sky-result-readings dd { margin: 0; color: #ffdea7; font: 25px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  #sky-controls {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px 20px;
    min-width: 0;
    min-height: 56px;
    padding: 0 0 13px;
    border-bottom: 1px solid oklch(0.34 0.009 270);
  }
  .sky-control-keys { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 13px; min-width: 0; }
  .sky-direction, .sky-key { display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
  .sky-direction { min-height: 40px; color: var(--muted); font-size: 11px; }
  .sky-direction svg { width: 15px; height: 17px; color: var(--ink); }
  .sky-key { min-height: 40px; border-color: transparent; padding: 5px 0; background: transparent; color: var(--muted); font-size: 11px; }
  .sky-key:disabled { color: var(--muted); }
  .sky-key:not(:disabled):hover { border-color: transparent; background: transparent; color: var(--ink); }
  .sky-key:not(:disabled):hover kbd { border-color: var(--accent); color: var(--accent); }
  .sky-key:not(:disabled):active { background: transparent; }
  .sky-key[data-held="true"] { color: var(--accent); }
  .sky-key[data-held="true"] kbd { border-color: var(--accent); background: #493b2b; }
  kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; min-height: 22px; border: 1px solid oklch(0.47 0.009 270); border-radius: 2px; padding: 1px 4px; color: var(--ink); font: 10px/1.4 var(--mono); box-shadow: 0 1px 0 oklch(0.13 0.005 270); }
  .sky-key-pair { display: inline-flex; align-items: center; gap: 4px; }
  .sky-key-pair span { color: var(--muted); font: 9px/1 var(--mono); }
  .sky-ammo-cluster { display: flex; align-items: center; gap: 11px; flex: none; white-space: nowrap; }
  .sky-ammo-label { color: var(--muted); font-size: 9px; letter-spacing: 1px; }
  #sky-ammo { display: flex; align-items: center; gap: 3px; color: var(--accent); }
  #sky-ammo svg { display: block; width: 10px; height: 24px; image-rendering: pixelated; }
  #sky-ammo [data-empty="true"], #sky-ammo .empty { opacity: 0.23; }
  #sky-ammo-count { min-width: 40px; color: var(--ink); font: 10px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .sky-original { position: absolute; right: 0; bottom: -10px; padding-left: 7px; background: var(--page); color: oklch(0.7 0.009 270); font-size: 9px; line-height: 1.4; text-decoration: none; }
  #sky-status { position: absolute; left: 0; bottom: -10px; max-width: 72%; margin: 0; padding-right: 7px; background: var(--page); color: var(--muted); font-size: 9px; line-height: 1.4; }
  #sky-status:empty { display: none; }
  #sky-app[data-mode="play"] #sky-brand,
  #sky-app[data-mode="paused"] #sky-brand,
  #sky-app[data-mode="waveclear"] #sky-brand,
  #sky-app[data-mode="dying"] #sky-brand,
  #sky-app[data-mode="failed"] #sky-brand { top: 25px; left: 26px; width: 150px; }
  #sky-app[data-mode="play"] .sky-brand-cn,
  #sky-app[data-mode="play"] .sky-location,
  #sky-app[data-mode="paused"] .sky-brand-cn,
  #sky-app[data-mode="paused"] .sky-location,
  #sky-app[data-mode="waveclear"] .sky-brand-cn,
  #sky-app[data-mode="waveclear"] .sky-location,
  #sky-app[data-mode="dying"] .sky-brand-cn,
  #sky-app[data-mode="dying"] .sky-location,
  #sky-app[data-mode="failed"] .sky-brand-cn,
  #sky-app[data-mode="failed"] .sky-location { display: none; }
  #sky-app[data-mode="play"] #sky-mode-label,
  #sky-app[data-mode="paused"] #sky-mode-label,
  #sky-app[data-mode="waveclear"] #sky-mode-label,
  #sky-app[data-mode="dying"] #sky-mode-label,
  #sky-app[data-mode="failed"] #sky-mode-label { font-size: 8px; letter-spacing: 0.8px; margin-bottom: 5px; }
  #sky-app[data-mode="play"] #sky-mode-label::before,
  #sky-app[data-mode="paused"] #sky-mode-label::before,
  #sky-app[data-mode="waveclear"] #sky-mode-label::before,
  #sky-app[data-mode="dying"] #sky-mode-label::before,
  #sky-app[data-mode="failed"] #sky-mode-label::before { width: 14px; height: 2px; }
  #sky-app[data-view="cockpit"] #sky-brand,
  #sky-app[data-view="cockpit"] #sky-telemetry { visibility: hidden; pointer-events: none; }
  #sky-app[data-view="cockpit"] #sky-camera { top: 18px; bottom: auto; }
  #sky-app[data-view="cockpit"] #sky-combat { top: 72px; }
  #sky-app:fullscreen { background: var(--page); }
  noscript { position: fixed; inset: 35% 20px auto; z-index: var(--z-modal); padding: 20px; background: #23262b; color: #ffe4b7; text-align: center; }

  }

    .sky-masthead-name { font-size: 12px; letter-spacing: 0.7px; }

    .sky-header-actions { gap: 6px; }

    .sky-brand-cn { margin-top: 7px; font-size: 15px; letter-spacing: 4px; }

    .sky-reading + .sky-reading { padding-left: 7px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  @media (forced-colors: active) { button, #stage, .sky-dialog, kbd { border-color: ButtonText; } button:focus-visible, a:focus-visible { outline-color: Highlight; } }

<body class="title">
<main id="sky-app" data-mode="loading" data-view="chase" data-flight="free" aria-label="天际巡航游戏">
