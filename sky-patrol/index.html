    const tx = VW / 2 + d * pxPerDeg;
    const val = ((td % 360) + 360) % 360;
    const isMajor = Math.abs(d) % 30 === 0;
    const isMid = Math.abs(d) % 10 === 0;
    const tickH = isMajor ? 4 : (isMid ? 3 : 2);
    rect(tx, y + 2, 1, tickH, isMajor ? '#f0c05a' : '#8f7a5e');
    if (isMajor) {
      drawText(pad(Math.round(val / 10) % 36, 2), tx, y + 11, { size: 6, color: '#e3d3b2', align: 'center' });
    }
  }
  ctx.restore();
  // center caret + current heading readout
  ctx.save();
  ctx.fillStyle = PAL.gold;
  ctx.beginPath();
  ctx.moveTo(VW / 2 - 3, y + h);
  ctx.lineTo(VW / 2 + 3, y + h);
  ctx.lineTo(VW / 2, y + h + 4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  drawText(`${pad(Math.round(deg), 3)}`, VW / 2, y + h + 12, {
    size: 7, color: PAL.cream, align: 'center', shadow: '#0b0912', spacing: 1
  });
  drawText(compassLabel(deg), VW / 2 + 30, y + 11, { size: 6, color: PAL.gold, align: 'left' });
}

function hudBlocked(x, y) {
  const W = VW, H = VH;
  if (x < 132 && y < 128) return true;            // objectives + shield block
  if (x > W - 136 && y < 64) return true;          // score
  if (x < 100 && y > 116 && y < 172) return true;  // speed / radar alt
  if (x > W - 100 && y > 116 && y < 172) return true; // altitude / VS
  if (Math.abs(x - W / 2) < 120 && y < 64) return true; // heading tape + banner
  if (Math.abs(x - W / 2) < 84 && y > H - 56) return true; // weapon bar
  if (x > W - 86 && y > H - 98) return true;       // radar scope
  return false;
}

function drawTargetMarkers() {
  const p = G.player;
  const tmp = {};
  let count = 0;
  for (const t of collectTargets()) {
    if (count > 10) break;
    const d = vdist(p.pos, t.pos);
    if (d > 3400) continue;
    if (targetConcealed(t)) continue;
    const s = {};
    if (!projectToScreen({ x: t.pos.x, y: t.pos.y + (t.isGround ? 2 : 1.2), z: t.pos.z }, s)) continue;
    if (!s.visible) {
      // edge cue for off-screen enemies
      if (!t.isGround && d < 3200 && s.w > 0) drawEdgeCue(s, d, t);
      continue;
    }
    // never scribble target brackets over the fixed instrument panels
    if (hudBlocked(s.x, s.y)) continue;
    count++;
    const isLock = G.lock.target === t;
    const isDrone = t.kind === 'drone';
    const col = isLock ? PAL.goldHot : (isDrone ? '#ff9083' : '#ffc25e');
    const a = clamp01(0.9 - Math.max(0, d - 2100) / 2200);
    const r = isLock ? 12 : (isDrone ? 8 : 7);
    const x = Math.round(s.x), y = Math.round(s.y);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = 'rgba(8,6,12,0.9)';
    ctx.lineWidth = 3;
    drawBracket(x, y, r + 1, isLock ? 'diamond' : 'square', ctx);
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    drawBracket(x, y, r, isLock ? 'diamond' : 'square', ctx);
    if (!isLock && !isDrone) {
      ctx.fillStyle = col;
      ctx.fillRect(x - 1, y - 1, 2, 2);
    }
    ctx.restore();
    if (isLock) {
      const locked = G.lock.phase === 'locked';
      const ringCol = locked ? PAL.goldHot : '#c4f4e9';
      const pulse = 0.5 + 0.5 * Math.sin(G.realTime * (locked ? 5.5 : 8.5));
      const rad = r + 17 + pulse * 2;
      const rot = G.realTime * (locked ? 2.2 : 3.4);
      ctx.save();
      ctx.globalAlpha = 0.95;
      // heavy dark base: the ring stays readable over bright snow and clouds
      ctx.strokeStyle = 'rgba(6,8,12,0.85)';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.stroke();
      // rotating segmented highlight ring
      ctx.strokeStyle = ringCol;
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const a0 = rot + i * TAU / 8;
        ctx.beginPath(); ctx.arc(x, y, rad, a0, a0 + TAU / 8 - 0.22); ctx.stroke();
      }
      // four cardinal ticks outside the ring
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = rot * 0.5 + i * TAU / 4;
        const ca = Math.cos(a), sa = Math.sin(a);
        ctx.beginPath();
        ctx.moveTo(x + ca * (rad + 3), y + sa * (rad + 3));
        ctx.lineTo(x + ca * (rad + 8), y + sa * (rad + 8));
        ctx.stroke();
      }
      // lock-on progress ring just inside the brackets
      const prog = clamp01(G.lock.progress);
      ctx.strokeStyle = 'rgba(6,8,12,0.9)';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y, r + 6, 0, TAU); ctx.stroke();
      ctx.strokeStyle = ringCol;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r + 6, -Math.PI / 2, -Math.PI / 2 + Math.max(0.02, prog) * TAU); ctx.stroke();
      if (locked) {
        // slow expanding confirmation echo
        ctx.globalAlpha = 0.28 + 0.4 * (1 - pulse);
        ctx.strokeStyle = '#fff3c2';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, rad + 4 + (1 - pulse) * 6, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }
    const distY = isLock ? y + 46 : y + r + 13;
    drawText(`${d > 1000 ? (d / 1000).toFixed(1) + 'K' : Math.round(d)}`, x, distY, {
      size: 8, color: col, align: 'center', shadow: '#0b0912', mono: true
    });
    const labelY = y - (isLock ? 44 : r + 7);
    drawText(isDrone ? '敌机' : (t.type === 'sam' ? '防空' : '装甲'), x, labelY, {
      size: 10, color: col, align: 'center', alpha: 0.9, shadow: '#0b0912'
    });
    if (isDrone) {
      const hp = clamp01(t.hp / DRONE_MAX_HP);
      const barX = clamp(x - 21, 3, VW - 45);
      const barY = Math.max(4, labelY - 19);
      rect(barX, barY, 42, 6, '#101922');
      rect(barX + 1, barY + 1, 40 * hp, 4, hp > 0.5 ? '#69d5a2' : (hp > 0.25 ? '#dfb466' : '#e67468'));
      rectLine(barX, barY, 42, 6, '#93a7ad');
    }
    if (isLock) {
      if (G.lock.phase === 'locked') {
        drawText('已锁定', x, y + 59, {
          size: 10, color: PAL.goldHot, align: 'center', shadow: '#0b0912'
        });
      } else {
        const pctStr = `${Math.floor(G.lock.progress * 100)}%`;
        const lw = textWidth('锁定中', 10);
        const pw = textWidth(pctStr, 9, true);
        const left = x - (lw + 4 + pw) / 2;
        drawText('锁定中', left, y + 59, { size: 10, color: '#f0e3c6', shadow: '#0b0912' });
        drawText(pctStr, left + lw + 4, y + 59, { size: 9, color: '#f0e3c6', mono: true, shadow: '#0b0912' });
      }
    }
  }
}

function drawBracket(x, y, r, shape, c) {
  const k = Math.max(3, Math.round(r * 0.55));
  if (shape === 'square') {
    c.beginPath();
    c.moveTo(x - r, y - r + k); c.lineTo(x - r, y - r); c.lineTo(x - r + k, y - r);
    c.moveTo(x + r - k, y - r); c.lineTo(x + r, y - r); c.lineTo(x + r, y - r + k);
    c.moveTo(x - r, y + r - k); c.lineTo(x - r, y + r); c.lineTo(x - r + k, y + r);
    c.moveTo(x + r - k, y + r); c.lineTo(x + r, y + r); c.lineTo(x + r, y + r - k);
    c.stroke();
  } else {
    const d = Math.round(r * 0.72);
    c.beginPath();
    c.moveTo(x, y - d - 3); c.lineTo(x + 3, y - d + 1); c.lineTo(x + d + 3, y - d + 1);
    c.moveTo(x, y - d - 3); c.lineTo(x - 3, y - d + 1); c.lineTo(x - d - 3, y - d + 1);
    c.moveTo(x, y + d + 3); c.lineTo(x + 3, y + d - 1); c.lineTo(x + d + 3, y + d - 1);
    c.moveTo(x, y + d + 3); c.lineTo(x - 3, y + d - 1); c.lineTo(x - d - 3, y + d - 1);
    c.moveTo(x - d - 3, y - 2); c.lineTo(x - d - 3, y + 2);
    c.moveTo(x + d + 3, y - 2); c.lineTo(x + d + 3, y + 2);
    c.stroke();
  }
}

function drawEdgeCue(s, d, t) {
  const cx = VW / 2, cy = VH / 2;
  let dx = s.x - cx, dy = s.y - cy;
  if (!isFinite(dx) || !isFinite(dy)) return;
  const margin = 18;
  const sx = (VW / 2 - margin) / Math.max(1, Math.abs(dx));
  const sy = (VH / 2 - margin) / Math.max(1, Math.abs(dy));
  const f = Math.min(sx, sy);
  const x = cx + dx * f, y = cy + dy * f;
  const a = Math.atan2(dy, dx);
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.translate(x, y);
  ctx.rotate(a);
  ctx.fillStyle = '#ff9b8c';
  ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-3, -3); ctx.lineTo(-3, 3); ctx.closePath(); ctx.fill();
  ctx.restore();
  drawText(`${(d / 1000).toFixed(1)}`, x - Math.cos(a) * 10, y - Math.sin(a) * 10 + 3, {
    size: 5, color: '#ffb2a3', align: 'center', alpha: 0.6, shadow: '#0b0912'
  });
}

function drawTopPlayerIcon() {
  const p = G.player;
  if (!p) return;
  const s = {};
  if (!projectToScreen(p.pos, s) || !s.visible) return;
  const x = Math.round(s.x), y = Math.round(s.y);
  const ppm = pxPerM(s.dist);
  const size = clamp(10 + 90 * ppm, 9, 17);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(p.yaw);
  ctx.fillStyle = 'rgba(8,6,12,0.8)';
  ctx.beginPath();
  ctx.moveTo(0, -size - 1);
  ctx.lineTo(2, -size * 0.32); ctx.lineTo(size * 0.8, -1);
  ctx.lineTo(size * 0.8, 2); ctx.lineTo(2, 2); ctx.lineTo(1.5, size * 0.42);
  ctx.lineTo(-1.5, size * 0.42); ctx.lineTo(-2, 2); ctx.lineTo(-size * 0.8, 2);
  ctx.lineTo(-size * 0.8, -1); ctx.lineTo(-2, -size * 0.32);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd27a';
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.lineTo(1.4, -size * 0.3); ctx.lineTo(size * 0.7, 0);
  ctx.lineTo(1.4, 1.2); ctx.lineTo(1, size * 0.36);
  ctx.lineTo(-1, size * 0.36); ctx.lineTo(-1.4, 1.2); ctx.lineTo(-size * 0.7, 0);
  ctx.lineTo(-1.4, -size * 0.3);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#b7e5db';
  ctx.fillRect(-1, -size * 0.35, 2, size * 0.5);
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#ffe0a0';
  ctx.beginPath(); ctx.arc(x, y, size + 3, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawAimReticle() {
  if (G.view === 0) {
    // top-down command reticle follows the cursor
    const x = Math.round(INPUT.mx), y = Math.round(INPUT.my);
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = '#bfe9de';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, 8, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 13, y); ctx.lineTo(x - 4, y);
    ctx.moveTo(x + 4, y); ctx.lineTo(x + 13, y);
    ctx.moveTo(x, y - 13); ctx.lineTo(x, y - 4);
    ctx.moveTo(x, y + 4); ctx.lineTo(x, y + 13);
    ctx.stroke();
    ctx.restore();
    return;
  }
  const cx = Math.round(VW / 2), cy = Math.round(VH / 2);
  const p = G.player;
  const col = G.lock.phase === 'locked' ? '#ffe39a' : (G.lock.phase === 'locking' ? '#f0d39a' : '#b7e5db');
  ctx.save();
  ctx.globalAlpha = 0.82;
  ctx.strokeStyle = 'rgba(8,6,12,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 14, 0, TAU); ctx.stroke();
  ctx.strokeStyle = col;
  ctx.lineWidth = 1;
  // four segmented arcs
  for (let i = 0; i < 4; i++) {
    const a0 = i * Math.PI / 2 + 0.28, a1 = (i + 1) * Math.PI / 2 - 0.28;

  }
  ctx.beginPath();
  ctx.moveTo(cx - 20, cy); ctx.lineTo(cx - 16, cy);
  ctx.moveTo(cx + 16, cy); ctx.lineTo(cx + 20, cy);
  ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy - 16);
  ctx.moveTo(cx, cy + 16); ctx.lineTo(cx, cy + 20);
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.fillRect(cx - 1, cy - 1, 3, 3);
  ctx.restore();
  // the target marker already shows LOCK / LOCKING nn% next to the ring
  if (!G.lock.target) {
    drawText('搜索', cx, cy + 33, {
      size: 10, color: col, align: 'center', alpha: 0.85, shadow: '#0b0912'
    });
  }
}

// -------------------------------------------------------------- radar -------
function ensureRadarCanvas() {
  if (RADAR.canvas) return;
  RADAR.canvas = document.createElement('canvas');
  RADAR.canvas.width = 56; RADAR.canvas.height = 56;
  RADAR.rctx = RADAR.canvas.getContext('2d');
  RADAR.rctx.imageSmoothingEnabled = false;
}

function updateRadarMap() {
  if (!G.map || !G.player) return;
  ensureRadarCanvas();
  const p = G.player;
  if (G.realTime - RADAR.lastT < 0.32 && hdist(p.pos, { x: RADAR.lastX, z: RADAR.lastZ }) < 55) return;
  RADAR.lastT = G.realTime;
  RADAR.lastX = p.pos.x; RADAR.lastZ = p.pos.z;
  const N = 56, range = 3000;
  const img = RADAR.rctx.createImageData(N, N);
  const d = img.data;
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const wx = p.pos.x + (x - N / 2 + 0.5) / N * range * 2;
      const wz = p.pos.z + (y - N / 2 + 0.5) / N * range * 2;
      const h = G.map.heightAt(wx, wz);
      const f = G.map.forestAt(wx, wz);
      let r, g, b;
      if (h < 0) { r = 16; g = 15; b = 17; }
      else {
        const hv = clamp01(h / 800);
        r = 70 + hv * 150;
        g = 46 + hv * 92 - f * 26;
        b = 18 + hv * 22;
        if (h > 620) { r += 35; g += 30; b += 25; }
        if (h < 8) { r = 110; g = 86; b = 40; }
      }
      const i = (y * N + x) * 4;
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
    }
  }
  RADAR.rctx.putImageData(img, 0, 0);
}

function drawRadarScope(cx, cy, r, detailed = false) {
  updateRadarMap();
  const range = 2800;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();
  rect(cx - r, cy - r, r * 2, r * 2, '#141008');
  // ground map
  ctx.globalAlpha = detailed ? 0.9 : 0.72;
  ctx.drawImage(RADAR.canvas, cx - r, cy - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
  // dark scope shading
  ctx.fillStyle = 'rgba(18,12,8,0.30)';
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  // range rings
  ctx.strokeStyle = 'rgba(255,180,63,0.32)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.98, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
  // scanlines
  ctx.globalAlpha = 0.12;
  for (let yy = cy - r; yy < cy + r; yy += 3) rect(cx - r, yy, r * 2, 1, '#ffca6a');
  ctx.globalAlpha = 1;
  // sweep
  const sweep = G.time * 1.9;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(sweep);
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = '#ffbb55';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, -0.5, 0); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.8;
  ctx.strokeStyle = '#ffd27a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r, 0); ctx.stroke();
  ctx.restore();
  // ground targets
  for (const g of G.ground) {
    if (g.dead) continue;
    const dx = (g.pos.x - G.player.pos.x) / range * r;
    const dz = (g.pos.z - G.player.pos.z) / range * r;
    if (dx * dx + dz * dz > (r - 2) * (r - 2)) continue;
    const x = cx + dx, y = cy + dz;
    ctx.fillStyle = '#ffd27a';
    if (g.type === 'sam') {
      ctx.beginPath(); ctx.moveTo(x, y - 2); ctx.lineTo(x + 2, y); ctx.lineTo(x, y + 2); ctx.lineTo(x - 2, y); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 3);
    }
  }
  // enemies
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (targetConcealed(e)) continue;
    const dx = (e.pos.x - G.player.pos.x) / range * r;
    const dz = (e.pos.z - G.player.pos.z) / range * r;
    if (dx * dx + dz * dz > (r - 2) * (r - 2)) continue;
    const x = cx + dx, y = cy + dz;
    const a = 0.55 + 0.45 * Math.sin(G.realTime * 5 + e.engineSeed);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ff7a62';
    ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 3);
    ctx.fillStyle = '#fff1d0';
    ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
    ctx.globalAlpha = 1;
  }
  // missiles — bright warning tracks
  for (const m of G.missiles) {
    if (m.dead || m.owner !== 'enemy') continue;
    const dx = (m.pos.x - G.player.pos.x) / range * r;
    const dz = (m.pos.z - G.player.pos.z) / range * r;
    if (dx * dx + dz * dz > (r - 2) * (r - 2)) continue;
    const blink = Math.sin(G.realTime * 22) > 0;
    ctx.fillStyle = blink ? '#ff5a4e' : '#ffd27a';
    ctx.fillRect(Math.round(cx + dx) - 1, Math.round(cy + dz) - 1, 2, 2);
  }
  // ownship
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(G.player.yaw);
  ctx.fillStyle = '#d9f6ee';
  ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(3, 3); ctx.lineTo(0, 1.5); ctx.lineTo(-3, 3); ctx.closePath(); ctx.fill();
  ctx.restore();
  // compass marks
  ctx.fillStyle = 'rgba(255,203,115,0.8)';
  ctx.font = '6px Silkscreen';
  ctx.textAlign = 'center';
  ctx.fillText('N', cx, cy - r + 8);
  ctx.fillStyle = 'rgba(255,203,115,0.45)';
  ctx.fillText('S', cx, cy + r - 3);
  ctx.fillText('E', cx + r - 5, cy + 3);
  ctx.fillText('W', cx - r + 5, cy + 3);
  ctx.restore();
  ctx.strokeStyle = '#8a6f47';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, r + 0.5, 0, TAU); ctx.stroke();
  // missile warning ring
  if (G.threatList.length) {
    const pulse = 0.4 + 0.6 * (Math.sin(G.realTime * 16) * 0.5 + 0.5);
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = '#ff5a4e';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r + 2, 0, TAU); ctx.stroke();
    ctx.restore();
    drawText('导弹', cx, cy - r - 5, { size: 8, color: '#ff7a62', align: 'center', shadow: '#0b0912' });
  }
  drawText('雷达 2.8', cx - r + 5, cy - r + 9, {
    size: 9, color: '#ffcb73', align: 'left', shadow: '#0a0705'
  });
}

function drawMiniRadar() {
  const r = 34;
  const x = INPUT.touchMode ? 46 : VW - 44;
  const y = VH - 44;
  drawRadarScope(x, y, r, false);
}

// -------------------------------------------------------------- cockpit -----
function drawCockpit(alpha) {
  if (alpha <= 0.01) return;
  const p = G.player;
  if (!p) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  const panelTop = VH - 100;

  // canopy frame
  ctx.fillStyle = '#17121e';
  ctx.fillRect(0, 0, VW, 4);
  ctx.fillStyle = '#0d0a12';
  ctx.fillRect(0, 4, VW, 1);
  // side bolsters
  ctx.fillStyle = '#1b1622';
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(VW * 0.135, 0); ctx.lineTo(VW * 0.105, 96);
  ctx.lineTo(VW * 0.055, panelTop); ctx.lineTo(0, panelTop);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(VW, 0); ctx.lineTo(VW * 0.865, 0); ctx.lineTo(VW * 0.895, 96);
  ctx.lineTo(VW * 0.945, panelTop); ctx.lineTo(VW, panelTop);
  ctx.closePath(); ctx.fill();
  // frame highlights
  ctx.strokeStyle = '#3a3040';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(1, 5); ctx.lineTo(VW * 0.132, 5); ctx.lineTo(VW * 0.102, 95);
  ctx.moveTo(VW - 1, 5); ctx.lineTo(VW * 0.868, 5); ctx.lineTo(VW * 0.898, 95);
  ctx.stroke();
  // canopy bow
  ctx.fillStyle = '#221b2a';
  ctx.beginPath();
  ctx.moveTo(VW * 0.44, 0); ctx.lineTo(VW * 0.56, 0); ctx.lineTo(VW * 0.545, 8);
  ctx.lineTo(VW * 0.455, 8); ctx.closePath(); ctx.fill();
  // glass glare streaks
  ctx.globalAlpha = alpha * 0.05;
  ctx.fillStyle = '#ffe2bd';
  ctx.beginPath(); ctx.moveTo(VW * 0.16, 120); ctx.lineTo(VW * 0.30, 0); ctx.lineTo(VW * 0.37, 0); ctx.lineTo(VW * 0.23, 120); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = alpha;

  // instrument panel
  drawCockpitPanel(p, panelTop);

  ctx.restore();
}

function drawCockpitPanel(p, top) {
  const w = VW, bottom = VH;
  // panel body
  ctx.fillStyle = '#1b1623';
  ctx.fillRect(0, top, w, bottom - top);
  ctx.fillStyle = '#2c2334';
  ctx.fillRect(0, top, w, 4);
  ctx.fillStyle = '#6b563f';
  ctx.fillRect(0, top, w, 1);
  ctx.fillStyle = '#3a2f40';
  ctx.fillRect(0, top + 4, w, 1);
  // bevel glare
  ctx.globalAlpha *= 0.7;
  ctx.fillStyle = '#100d16';
  ctx.fillRect(0, bottom - 2, w, 2);
  ctx.globalAlpha /= 0.7;
  // plate seams + rivets
  ctx.fillStyle = '#0f0c15';
  for (const rx of [0.24, 0.47, 0.68]) ctx.fillRect(Math.round(w * rx), top + 6, 1, bottom - top - 8);
  ctx.fillStyle = '#3b3044';
  for (let x = 14; x < w; x += 46) { ctx.fillRect(x, top + 6, 1, 1); ctx.fillRect(x, bottom - 5, 1, 1); }

  const cy = top + 48;
  const iscale = clamp((w - 116) / 488, 0.70, 1);
  const ix = x => 8 + (x - 8) * iscale;
  const radarR = w >= 560 ? 34 : 29;
  ctx.save();
  ctx.translate(0, 0);
  // throttle quadrant
  const thrX = 9;
  rect(thrX, cy - 20, 8, 60, '#0f0c15');
  rectLine(thrX, cy - 20, 8, 60, '#4f4152');
  const thr = clamp01(p.speed / SPEED_BURN);
  const knobY = cy + 36 - Math.round(thr * 50);
  rect(thrX + 1, knobY, 6, 8, p.burning ? '#ffb347' : '#b9aa8a');
  rectLine(thrX + 1, knobY, 6, 8, '#0b0912');
  drawText('油门', thrX + 4, cy + 48, { size: 8, color: '#8f7a5e', align: 'center' });

  // warning lamps strip
  const lampDefs = [
    ['弹警', G.threatList.length > 0, '#ff5a4e'],
    ['锁定', G.lock.phase === 'locked', '#ffd27a'],
    ['地形', p.agl < 130, '#ff8a4a'],
    ['燃油', p.fuel < 18, '#ffb347'],
    ['护盾', p.shield < 30, '#ff6b5e'],
  ];
  let lx = ix(196);
  for (const [label, on, col] of lampDefs) {
    ctx.globalAlpha = 1;
    rect(lx, top + 8, 22, 8, on ? '#3a1618' : '#0f0c15');
    rectLine(lx, top + 8, 22, 8, on ? col : '#312839');
    drawText(label, lx + 11, top + 15, { size: 8, color: on ? col : '#5e5266', align: 'center' });
    lx += 25;
  }
  // local clock
  const tSec = (G.clockStart + G.missionTime) % 86400;
  const hh = Math.floor(tSec / 3600), mm = Math.floor((tSec % 3600) / 60);
  const clockX = ix(420);
  rect(clockX, top + 7, 46, 12, '#0f0c15');
  rectLine(clockX, top + 7, 46, 12, '#4f4152');
  drawText(`${pad(hh, 2)}:${pad(mm, 2)}`, clockX + 23, top + 16, { size: 7, color: '#ffcf86', align: 'center', mono: true });
  drawText('当地', clockX + 23, top + 25, { size: 8, color: '#7f6b52', align: 'center' });

  // Airspeed
  drawAirspeedGauge(ix(52), cy + 4, 24, p);
  // ADI
  drawADI(ix(112), cy + 4, 24, p);
  // Altimeter
  drawAltimeter(ix(146), top + 20, 56, 38, p);
  // turn & slip
  drawTurnSlip(ix(218), cy + 4, 15, p);
  // VSI
  drawVSI(ix(254), cy + 4, 15, p);
  // heading
  drawHeadingBox(ix(276), top + 17, 72, 26, p);
  // engines
  drawEngineDial(ix(364), cy + 6, 13, clamp01((p.burning ? 0.92 : 0.55) + (p.speed - SPEED_CRUISE) / 400), 'L');
  drawEngineDial(ix(396), cy + 6, 13, clamp01((p.burning ? 0.94 : 0.55) + (p.speed - SPEED_CRUISE) / 400), 'R');
  // radar
  drawRadarScope(VW - 48, cy + 4, radarR, true);
  // shield / fuel / weapons strip at the bottom
  const by = VH - 21;
  drawText('护盾', ix(74), by + 5, { size: 8, color: '#8f7a5e' });
  segBar(ix(100), by, 66, 5, p.shield / 100, p.shield < 25 ? PAL.red : '#7fd8cd', '#2a2030', 16);
  drawText('燃油', ix(174), by + 5, { size: 8, color: '#8f7a5e' });
  segBar(ix(198), by, 58, 5, p.fuel / 100, p.burning ? '#ffb347' : '#c2913e', '#2a2030', 14);
  drawText(`导弹 ${p.missiles}`, ix(266), by + 5, { size: 8, color: '#e5c273' });
  drawText(`干扰 ${p.flares}`, ix(302), by + 5, { size: 8, color: '#cdb57f' });
  drawText(`G ${p.gLoad.toFixed(1)}`, ix(338), by + 5, { size: 5, color: p.gLoad > 6 ? PAL.red : '#bce7e0' });
  drawText(`${pad(Math.round(p.speed * 1.94384), 3)}`, ix(378), by + 5, { size: 5, color: '#cbbd9f', mono: true });
  drawText('节', ix(394), by + 5, { size: 8, color: '#cbbd9f' });
  // radar altitude digital

}

function drawAirspeedGauge(cx, cy, r, p) {
  const knots = p.speed * 1.94384;
  circleFill(cx, cy, r, '#0e0c13');
  circleLine(cx, cy, r, '#6f5c42', 1, 1);
  circleLine(cx, cy, r - 1, '#2d2535', 1, 1);
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  ctx.save();
  for (let i = 0; i <= 10; i++) {
    const a = lerp(a1, a0, i / 10); // sweep from bottom-left to bottom-right
    const x1 = cx + Math.cos(a) * (r - 3), y1 = cy - Math.sin(a) * (r - 3);
    const x2 = cx + Math.cos(a) * (r - (i % 5 === 0 ? 7 : 5)), y2 = cy - Math.sin(a) * (r - (i % 5 === 0 ? 7 : 5));
    line(x1, y1, x2, y2, i >= 8 ? '#c25945' : '#b8a47b', 1);
    if (i % 2 === 0) {
      drawText(String(i * 80), cx + Math.cos(a) * (r - 12), cy - Math.sin(a) * (r - 12) + 2, {
        size: 4, color: '#8f7a5e', align: 'center'
      });
    }
  }
  const frac = clamp01(knots / 800);
  const na = lerp(a1, a0, frac);
  line(cx, cy, cx + Math.cos(na) * (r - 7), cy - Math.sin(na) * (r - 7), '#ffd27a', 1);
  circleFill(cx, cy, 2, '#d7c49c');
  drawText('空速', cx, cy + r + 7, { size: 8, color: '#8f7a5e', align: 'center' });
  drawText(String(Math.round(knots)), cx, cy + 12, { size: 6, color: '#f0e3c6', align: 'center', mono: true });
  ctx.restore();
}

function drawADI(cx, cy, r, p) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();
  ctx.translate(cx, cy);
  ctx.rotate(p.roll);
  const pitchPx = clamp(p.pitch, -1, 1) / DEG * 0.7;
  ctx.translate(0, pitchPx);
  ctx.fillStyle = '#8d7b9d';
  ctx.fillRect(-r * 2, -r * 3, r * 4, r * 3);
  ctx.fillStyle = '#443854';
  ctx.fillRect(-r * 2, 0, r * 4, r * 3);
  // sky bands
  ctx.fillStyle = 'rgba(240,182,138,0.25)';
  ctx.fillRect(-r * 2, -r * 3, r * 4, 5);
  ctx.fillStyle = 'rgba(255,214,162,0.22)';
  ctx.fillRect(-r * 2, -r * 3 + 5, r * 4, 4);
  ctx.fillStyle = '#f0d3a8';
  ctx.fillRect(-r * 2, -1, r * 4, 2);
  ctx.strokeStyle = 'rgba(240,230,205,0.7)';
  ctx.lineWidth = 1;
  for (let a = -20; a <= 20; a += 10) {
    if (a === 0) continue;
    const yy = -a * 0.7;
    const ww = Math.abs(a) === 20 ? 7 : 5;
    ctx.beginPath(); ctx.moveTo(-ww, yy); ctx.lineTo(ww, yy); ctx.stroke();
  }
  ctx.restore();
  // bank pointer
  ctx.save();
  ctx.strokeStyle = '#b8a47b';
  ctx.beginPath();
  for (let a = -60; a <= 60; a += 15) {
    const ang = -Math.PI / 2 + a * DEG;
    const x1 = cx + Math.cos(ang) * (r - 2), y1 = cy + Math.sin(ang) * (r - 2);
    const x2 = cx + Math.cos(ang) * (r - (Math.abs(a) % 30 === 0 ? 7 : 4));
    const y2 = cy + Math.sin(ang) * (r - (Math.abs(a) % 30 === 0 ? 7 : 4));
    line(x1, y1, x2, y2, '#d6c39a', 1);
  }
  const bankAng = -Math.PI / 2 + clamp(-p.roll, -1.2, 1.2);
  ctx.fillStyle = '#ffd27a';
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(bankAng) * (r - 1), cy + Math.sin(bankAng) * (r - 1));
  ctx.lineTo(cx + Math.cos(bankAng - 0.17) * (r - 6), cy + Math.sin(bankAng - 0.17) * (r - 6));
  ctx.lineTo(cx + Math.cos(bankAng + 0.17) * (r - 6), cy + Math.sin(bankAng + 0.17) * (r - 6));
  ctx.closePath(); ctx.fill();
  ctx.restore();
  circleLine(cx, cy, r, '#6f5c42', 1, 1);
  circleLine(cx, cy, r - 1, '#2d2535', 1, 1);
  // fixed aircraft symbol
  ctx.save();
  ctx.strokeStyle = '#ffd27a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 11, cy); ctx.lineTo(cx - 3, cy); ctx.lineTo(cx, cy + 3); ctx.lineTo(cx + 3, cy); ctx.lineTo(cx + 11, cy);
  ctx.stroke();
  ctx.fillStyle = '#ffd27a';
  ctx.fillRect(cx - 1, cy - 1, 2, 2);
  ctx.restore();
  drawText('姿态', cx, cy + r + 7, { size: 8, color: '#8f7a5e', align: 'center' });
}

function drawAltimeter(x, y, w, h, p) {
  rect(x, y, w, h, '#0d0b12');
  rectLine(x, y, w, h, '#4f4152');
  const ft = Math.max(0, Math.round(p.pos.y * 3.28084));

  }

  drawText('离地', x + 4, y + 36, { size: 8, color: p.agl < 130 ? '#ff9a62' : '#9fd6cc' });
  drawText(`${pad(Math.round(Math.max(0, p.agl) * 3.28084), 4)}`, x + w - 4, y + 36, {
    size: 5, color: p.agl < 130 ? '#ff9a62' : '#9fd6cc', align: 'right', mono: true
  });
}

function drawTurnSlip(cx, cy, r, p) {
  circleFill(cx, cy, r, '#0e0c13');
  circleLine(cx, cy, r, '#6f5c42', 1, 1);
  circleLine(cx, cy, r - 1, '#2d2535', 1, 1);
  line(cx - r + 4, cy, cx + r - 4, cy, '#7d6a51', 1);
  line(cx, cy - r + 4, cx, cy + r - 4, '#7d6a51', 1);

  const nx = cx + turn * (r - 6);
  ctx.save();
  ctx.strokeStyle = '#ffd27a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, cy - 3); ctx.lineTo(nx, cy + 3); ctx.stroke();
  ctx.fillStyle = '#ffd27a';
  ctx.fillRect(Math.round(nx) - 1, cy + 1, 2, 3);
  ctx.restore();
  // slip ball
  rect(cx - 7, cy + r - 8, 14, 4, '#17131d');
  rectLine(cx - 7, cy + r - 8, 14, 4, '#4f4152');
  const slip = clamp(-p.roll * 0.35, -1, 1);
  circleFill(cx + slip * 4, cy + r - 6, 1.5, '#d9c69f');

}

function drawVSI(cx, cy, r, p) {
  const vs = p.basis.fwd.y * p.speed * 196.85;
  rect(cx - 9, cy - 18, 18, 36, '#0d0b12');
  rectLine(cx - 9, cy - 18, 18, 36, '#4f4152');

    const y = cy + i * 7;
    line(cx - 7, y, cx - (i === 0 ? 3 : 5), y, '#8f7a5e', 1);
  }
  const nf = clamp(vs / 3000, -1, 1);
  const ny = cy - nf * 15;
  ctx.save();

  ctx.restore();

}

function drawHeadingBox(x, y, w, h, p) {
  const deg = compassDeg(p.yaw);
  rect(x, y, w, h, '#0d0b12');
  rectLine(x, y, w, h, '#4f4152');
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h - 9); ctx.clip();
  const pxPer = 1.15;
  for (let d = -32; d <= 32; d += 10) {
    const val = ((deg + d) % 360 + 360) % 360;
    const xx = x + w / 2 + d * pxPer;
    line(xx, y + 2, xx, y + (Math.abs(d) % 30 === 0 ? 6 : 4), '#a9936d', 1);
    if (Math.abs(d) % 30 === 0) drawText(compassLabel(val), xx, y + 13, { size: 6, color: '#e6d6b4', align: 'center' });
  }
  ctx.restore();
  ctx.fillStyle = '#ffd27a';
  ctx.beginPath(); ctx.moveTo(x + w / 2 - 2, y + h - 8); ctx.lineTo(x + w / 2 + 2, y + h - 8); ctx.lineTo(x + w / 2, y + h - 5); ctx.closePath(); ctx.fill();
  drawText(`${pad(Math.round(deg), 3)}`, x + w / 2, y + h - 0, { size: 6, color: '#ffd27a', align: 'center', mono: true });
  drawText('航向', x + w / 2, y + h + 10, { size: 8, color: '#8f7a5e', align: 'center' });
}

function drawEngineDial(cx, cy, r, val, label) {
  circleFill(cx, cy, r, '#0e0c13');
  circleLine(cx, cy, r, '#6f5c42', 1, 1);
  ctx.save();
  for (let i = 0; i <= 5; i++) {
    const a = Math.PI * 0.75 + i * Math.PI * 0.3;
    line(cx + Math.cos(a) * (r - 2), cy - Math.sin(a) * (r - 2), cx + Math.cos(a) * (r - 5), cy - Math.sin(a) * (r - 5), '#9c8968', 1);
  }
  const a = Math.PI * 0.75 + clamp01(val) * Math.PI * 1.5;
  ctx.strokeStyle = '#ffd27a';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (r - 4), cy - Math.sin(a) * (r - 4)); ctx.stroke();
  ctx.fillStyle = '#d9c69f';
  ctx.fillRect(cx - 1, cy - 1, 2, 2);
  if (val > 0.88) { ctx.globalAlpha = 0.5; circleLine(cx, cy, r - 2, '#ff6b4e', 1, 1); }
  ctx.restore();
  drawText(label, cx, cy + r + 6, { size: 4, color: '#8f7a5e', align: 'center' });
}

function drawBanner() {
  if (!G.banner) return;
  const b = G.banner;

// ---------------------------------------------------------------------------
// UI: screens, touch controls, input actions.
// ---------------------------------------------------------------------------
function toggleSound() {
  G.sound = !G.sound;
  AudioSys.setEnabled(G.sound);
  if (G.sound) AudioSys.uiTick();
}

function beginSortie() {
  if (G.mode !== 'title') return;
  AudioSys.init();
  if (G.sound) AudioSys.setEnabled(true);
  resetMouseSteering();
  startRun();
}

function togglePause() {
  if (G.mode === 'play' || G.mode === 'waveclear') {
    resetMouseSteering();
    G.pausedFrom = G.mode;
    G.mode = 'paused';
    INPUT.left = INPUT.touchBurn = INPUT.touchGun = false;
    INPUT.keys.clear();
    AudioSys.updateEngine(false, 0, true);
    AudioSys.uiTick();
  } else if (G.mode === 'paused') {
    resetMouseSteering();
    G.mode = G.pausedFrom || 'play';
    G.pausedFrom = null;
    AudioSys.uiTick();
  }
}

// ------------------------------------------------------------- input --------
function onPrimaryDown() {
  if (G.mode === 'play' || G.mode === 'waveclear') firePlayerGuns();
}
function onSecondaryDown() {
  if (G.mode === 'play' || G.mode === 'waveclear') firePlayerMissile();
}
function onKeyDown(code) {
  if (code === 'KeyM') { toggleSound(); return; }
  if (G.mode === 'loading') return;
  if (code === 'Enter' || code === 'NumpadEnter') {
    if (G.mode === 'title') { beginSortie(); return; }
    if (G.mode === 'failed' && G.failTimer > 0.5) { restartRun(); return; }
    if (G.mode === 'paused') { togglePause(); return; }
  }
  if (code === 'Space') {
    if (G.mode === 'title') beginSortie();
    else if (G.mode === 'play' || G.mode === 'waveclear') cycleView();
    return;
  }
  if (code === 'Escape' || code === 'KeyP') {
    if (G.mode === 'play' || G.mode === 'waveclear' || G.mode === 'paused') togglePause();
    return;
  }
  if (code === 'KeyR') {
    if (G.mode === 'failed' && G.failTimer > 0.35) restartRun();
    return;
  }
  if (code === 'KeyQ') {
    triggerBarrelRoll();
    return;
  }
  if (code === 'KeyE') {
    if (G.mode === 'play' || G.mode === 'waveclear') firePlayerMissile();
    return;
  }
  if (code === 'KeyF') {
    if (G.mode === 'play' || G.mode === 'waveclear') firePlayerGuns();
    return;
  }
  if (code === 'KeyX' || code === 'KeyC') {
    if (G.mode === 'play' || G.mode === 'waveclear') tryFlares();
    return;
  }
}

// ------------------------------------------------------------ screens -------
function drawLoading() {
  const t = BOOT.startTime ? (performance.now() - BOOT.startTime) / 1000 : G.realTime;
  // cold alpine sky bands: slate overhead, pale blue-grey at the horizon
  const bands = [
    '#121c29', '#172233', '#1c2a3c', '#233345', '#2b3d4f',
    '#35495a', '#425665', '#526572', '#667781', '#829199'
  ];
  const horizon = Math.round(VH * 0.56);
  for (let i = 0; i < bands.length; i++) {
    const y0 = Math.round(i * horizon / bands.length);
    const y1 = Math.round((i + 1) * horizon / bands.length);
    rect(0, y0, VW, y1 - y0, bands[i]);
    // dither the seam into the next band
    if (i < bands.length - 1) {
      ctx.save(); ctx.globalAlpha = 0.45;
      for (let x = (i % 2) * 2; x < VW; x += 4) {
        ctx.fillStyle = bands[i + 1];
        ctx.fillRect(x, y1 - 1, 2, 1);
        ctx.fillRect(x + 1, y1, 1, 1);
      }
      ctx.restore();
    }
  }
  // soft horizon haze, no sun disc
  const sx = Math.round(VW * 0.64);
  ctx.save(); ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#b9c7ce';
  ctx.fillRect(0, horizon - 9, VW, 3);
  ctx.fillRect(0, horizon - 5, VW, 2);
  ctx.restore();
  // high cirrus, neutral grey-blue
  ctx.save(); ctx.globalAlpha = 0.5;
  for (let i = 0; i < 5; i++) {
    const x = (i * 149 + 60) % VW;
    const y = 34 + (i * 31) % 80;
    ctx.fillStyle = i % 2 ? '#8fa0aa' : '#b3c0c8';
    ctx.fillRect(x, y, 46 + i * 8, 1);
    ctx.fillRect(x + 9, y + 2, 31, 1);
  }
  ctx.restore();
  // mountain ridges with snow caps
  const ridgeLayers = [
    { base: horizon - 40, amp: 46, col: '#3c4d5e', snow: '#aab8c2', step: 23, seed: 1, snowAt: 0.34 },
    { base: horizon - 22, amp: 30, col: '#2c3b4a', snow: '#8fa0ad', step: 17, seed: 2, snowAt: 0.50 },
    { base: horizon - 8, amp: 15, col: '#1e2a36', step: 11, seed: 3, snow: null, snowAt: 1 },
  ];
  for (const L of ridgeLayers) {
    ctx.fillStyle = L.col;
    for (let x = 0; x < VW; x += L.step) {
      const n = hash2(Math.floor(x / L.step) + L.seed * 91, L.seed, 13);
      const h = Math.round(L.base - n * L.amp);
      ctx.fillRect(x, h, L.step, horizon + 6 - h);
    }
    if (L.snow) {
      ctx.fillStyle = L.snow;
      for (let x = 0; x < VW; x += L.step) {
        const n = hash2(Math.floor(x / L.step) + L.seed * 91, L.seed, 13);
        if (n <= L.snowAt) continue;
        const h = Math.round(L.base - n * L.amp);
        const cap = Math.min(6, 1 + Math.round((n - L.snowAt) * 9));
        ctx.fillRect(x + 1, h, L.step - 2, cap);
        ctx.fillRect(x + 3, h - 1, Math.max(2, L.step - 6), 1);
      }
    }
  }
  // dark conifer fringe on the far shore
  ctx.fillStyle = '#142019';
  for (let x = 0; x < VW; x += 2) {
    const n = hash2(x * 7 + 3, 5, 41);
    const th = 2 + Math.floor(n * 5);
    ctx.fillRect(x, horizon + 5 - th, 1 + (x % 3 === 0 ? 1 : 0), th);
  }
  // lake
  rect(0, horizon + 4, VW, VH - horizon - 4, '#16232b');
  for (let y = horizon + 7; y < VH; y += 3) {
    const a = 1 - (y - horizon) / (VH - horizon);
    ctx.globalAlpha = 0.18 * a;
    ctx.fillStyle = y % 6 === 0 ? '#a7b6bd' : '#4d6470';
    const w = 16 + ((y * 17) % 64);
    ctx.fillRect(sx - w / 2 + ((y * 13) % 9) - 4, y, w, 1);
  }
  ctx.globalAlpha = 1;
  // silhouetted lead aircraft
  const px = Math.round(VW * (0.22 + 0.03 * Math.sin(t * 0.22)));
  const py = Math.round(horizon * 0.34 + Math.sin(t * 0.6) * 2);
  drawPixelJet(px, py, 1, '#0f0c16');
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#ffcb88';
  ctx.fillRect(px - 15, py + 2, 11, 1);
  ctx.globalAlpha = 1;

  // title + loading
  drawText('巡逻：截击', VW / 2, 44, {
    size: 26, color: '#ffe7b8', align: 'center', spacing: 2, outline: '#18101a', bold: true
  });
  drawText('湖区 // 当地时间 07:12', VW / 2, 58, {
    size: 9, color: '#c2ced8', align: 'center', spacing: 0
  });
  const label = BOOT.stage || '准备出击';
  drawText(label, VW / 2, VH - 78, {
    size: 9, color: '#dde6ee', align: 'center', spacing: 0.5, shadow: '#120c12'
  });
  const pw = Math.min(300, Math.round(VW * 0.56));
  const pxx = Math.round(VW / 2 - pw / 2), pyy = VH - 66;
  rect(pxx - 1, pyy - 1, pw + 2, 10, '#0e0b13');
  rectLine(pxx - 1, pyy - 1, pw + 2, 10, '#6d563b');
  const fill = Math.round(pw * clamp01(BOOT.progress || 0));
  rect(pxx, pyy, fill, 8, '#d5a955');
  for (let x = pxx; x < pxx + fill; x += 6) {
    rect(x, pyy, 1, 8, '#ffe6a0');
  }
  drawText(`${Math.floor(clamp01(BOOT.progress || 0) * 100)}%`, VW / 2, VH - 45, {
    size: 7, color: '#ccd8e0', align: 'center', mono: true
  });
  drawText('提示：云层与森林可遮蔽你的雷达信号', VW / 2, VH - 24, {
    size: 9, color: '#a8b7c1', align: 'center'
  });
  if (BOOT.error) {
    rect(0, 0, VW, VH, 'rgba(10,7,12,0.86)');
    drawText('无法启动', VW / 2, VH / 2 - 16, { size: 18, color: '#ff7a62', align: 'center', spacing: 1 });
    drawText(BOOT.error, VW / 2, VH / 2 + 4, { size: 8, color: '#f0e3c6', align: 'center', mono: true });
    drawText('需要 WebGL2 才能渲染地形与体积云', VW / 2, VH / 2 + 24, {
      size: 9, color: '#c2ab80', align: 'center'
    });
  }
}

function drawPixelJet(x, y, s, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x - 14 * s, y, 28 * s, 2 * s);
  ctx.fillRect(x - 5 * s, y - 3 * s, 10 * s, 3 * s);
  ctx.fillRect(x - 2 * s, y - 5 * s, 4 * s, 2 * s);
  ctx.fillRect(x - 22 * s, y + 1 * s, 7 * s, 1 * s);
  ctx.fillRect(x + 15 * s, y + 1 * s, 7 * s, 1 * s);
  ctx.fillRect(x - 8 * s, y + 2 * s, 2 * s, 2 * s);
  ctx.fillRect(x + 6 * s, y + 2 * s, 2 * s, 2 * s);
}

function drawTitle() {
  const t = G.realTime;

  rect(0, 0, VW, VH, 'rgba(8,6,13,0.24)');

  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = '#0c0912';
  for (let y = 0; y < VH; y += 2) {
    const w = 3 + ((y * 7) % 5);

  }
  ctx.restore();
  // corner brackets
  ctx.strokeStyle = 'rgba(213,169,85,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(10, 26); ctx.lineTo(10, 10); ctx.lineTo(26, 10);
  ctx.moveTo(VW - 26, 10); ctx.lineTo(VW - 10, 10); ctx.lineTo(VW - 10, 26);
  ctx.stroke();
  drawText('第18截击中队  //  湖滨战区', 42, 27, {

function drawSoundButton(x, y, w, h) {
  const on = G.sound;
  panel(x, y, w, h, {
    fill: on ? '#2c2820' : '#1b1721', stroke: on ? '#e0b96b' : '#5c4c3b',
    alpha: 0.95
  });
  // speaker
  const ix = x + 6, iy = y + Math.round(h / 2);
  ctx.fillStyle = on ? '#ffe0a0' : '#9d8b71';
  ctx.fillRect(ix, iy - 2, 3, 4);
  ctx.beginPath();
  ctx.moveTo(ix + 3, iy - 2); ctx.lineTo(ix + 6, iy - 4); ctx.lineTo(ix + 6, iy + 4); ctx.lineTo(ix + 3, iy + 2);
  ctx.fill();
  if (on) {
    ctx.fillRect(ix + 8, iy - 3, 1, 6);
    ctx.fillRect(ix + 10, iy - 2, 1, 4);
  } else {
    ctx.fillStyle = '#7d6955';
    ctx.fillRect(ix + 8, iy - 3, 1, 1); ctx.fillRect(ix + 9, iy - 2, 1, 1);
    ctx.fillRect(ix + 10, iy - 1, 1, 1); ctx.fillRect(ix + 10, iy + 1, 1, 1);
    ctx.fillRect(ix + 9, iy + 1, 1, 1); ctx.fillRect(ix + 8, iy + 3, 1, 1);
  }
  drawText(on ? '音效 开' : '音效 关', x + w - 5, y + h / 2 + 3, {

const SKY_OCCLUSION = [];

function skyHeadingTape() {
  if (!G.player) return;
  const heading = compassDeg(G.player.yaw), cx = VW / 2;
  const span = Math.min(88, VW * 0.23), scale = span / 35;
  for (let d = Math.ceil((heading - 35) / 5) * 5; d <= heading + 35; d += 5) {
    const x = cx + (d - heading) * scale;
    const major = d % 15 === 0;
    line(x, 13, x, major ? 18 : 16, '#f4e8d1', 1, 0.85);
    if (major) drawText(pad((d % 360 + 360) % 360, 3), x, 27, {
      size: 6, mono: true, align: 'center', color: '#fff0d7', shadow: '#35323a'
    });
  }
  line(cx - 2, 7, cx, 10, '#f5c38a');
  line(cx + 2, 7, cx, 10, '#f5c38a');
}

// ---------------------------------------------------------------------------
// Boot, resize, render loop, screenshots/test harness.
// ---------------------------------------------------------------------------
const BOOT = {
  startTime: performance.now(),
  progress: 0,
  stage: '初始化飞行系统',
  error: null,
  ready: false,
};

const TEST = {
  errors: [],
  exceptions: [],
  readyAt: 0,
};
window.addEventListener('error', e => {
  TEST.errors.push(String(e.message || 'error'));
  if (TEST.errors.length > 40) TEST.errors.shift();
});
window.addEventListener('unhandledrejection', e => {
  TEST.exceptions.push(String(e.reason && (e.reason.stack || e.reason.message) || e.reason));
  if (TEST.exceptions.length > 40) TEST.exceptions.shift();
});

const PARAMS = new URLSearchParams(location.search);
G.seed = +(PARAMS.get('seed') || 1337);
G.sound = PARAMS.get('sound') === '1';
G.debug = PARAMS.get('debug') === '1';
G.scenarioName = PARAMS.get('scenario') || '';
const FIXED_QUALITY = PARAMS.get('quality') ? +PARAMS.get('quality') : 0;
const ADAPT_QUALITY = PARAMS.get('adapt') !== '0';
let qualityIndex = 0;
let worldHInit = false;
const QUALITY_STEPS = [640, 560, 480, 400, 340, 288, 240];
let cssRect = { left: 0, top: 0, width: 1, height: 1 };

function resizeAll() {
  const iw = Math.max(1, window.innerWidth);
  const ih = Math.max(1, window.innerHeight);
  const winAspect = iw / ih;
  const aspect = clamp(winAspect, 1.45, 2.7);
  let w = iw, h = w / aspect;
  if (h > ih) { h = ih; w = h * aspect; }
  cssRect = { left: (iw - w) / 2, top: (ih - h) / 2, width: w, height: h };
  VW = Math.round(BASE_H * aspect);
  VH = BASE_H;
  VIEW_ASPECT = aspect;
  for (const c of [glCanvas, uiCanvas]) {
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    c.style.left = cssRect.left + 'px';
    c.style.top = cssRect.top + 'px';
  }
  // Back the UI canvas at (near) device-pixel density so text and lines stay
  // crisp instead of being stretched from a 604x340 buffer.
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const uiSS = clamp(Math.round((h * dpr) / VH), 1, 3);
  if (uiSS !== UI_DPR) CJK_CACHE.clear();
  UI_DPR = uiSS;
  uiCanvas.width = Math.round(VW * UI_DPR);
  uiCanvas.height = Math.round(VH * UI_DPR);
  ctx.imageSmoothingEnabled = false;
  if (FIXED_QUALITY) WORLD_H = clamp(FIXED_QUALITY, 180, 720);
  else if (!worldHInit) {
    WORLD_H = clamp(Math.round(h * 0.72), 360, 640);
    worldHInit = true;
  }
  WORLD_H = clamp(WORLD_H, 180, 720);
  const ww = Math.max(64, Math.round(WORLD_H * aspect));
  glCanvas.width = ww;
  glCanvas.height = WORLD_H;
  Renderer.resize(ww, WORLD_H);
  INPUT.mx = clamp(INPUT.mx || VW / 2, 0, VW);
  INPUT.my = clamp(INPUT.my || VH * 0.52, 0, VH);
  if (!INPUT.mx || !INPUT.my) { INPUT.mx = VW / 2; INPUT.my = VH * 0.52; }
}

function setBodyClass() {
  const interactive = G.mode === 'loading' || G.mode === 'title' || G.mode === 'failed' || G.mode === 'paused';
  document.body.classList.toggle('playing', !interactive);
  document.body.classList.toggle('title', interactive);
}

// ---------------------------------------------------------------- boot ------
function waitForFonts() {
  return new Promise(resolve => {
    if (!document.fonts) { resolve(); return; }
    const timer = setTimeout(resolve, 2600);
    document.fonts.ready.then(() => { clearTimeout(timer); resolve(); }).catch(() => { clearTimeout(timer); resolve(); });
  });
}

async function boot() {
  resizeAll();
  BOOT.progress = 0.02;
  BOOT.stage = '初始化飞行系统';
  const ok = Renderer.init(glCanvas);
  if (!ok) {
    BOOT.error = 'WebGL2 context unavailable. Try Chrome, Edge, Firefox or Safari 15+.';
    drawUIFrame();
    return;
  }
  resizeAll(); // the renderer only allocates its FBO once a GL context exists
  requestAnimationFrame(loop);

  const fontWait = waitForFonts();
  let map = null;
  try {
    map = await generateWorld(G.seed, (p, label) => {
      BOOT.progress = 0.03 + p * 0.92;
      BOOT.stage = label;
    });
  } catch (err) {
    console.error(err);
    BOOT.error = 'World generation failed: ' + (err && err.message ? err.message : err);
    drawUIFrame();
    return;
  }
  BOOT.progress = 0.96;
  BOOT.stage = '编译地形与飞行系统';
  await fontWait;
  try {
    G.map = map;
    Forest.init(map, G.seed);
    Renderer.uploadWorld(map);
    G.meshes = buildMeshes();
    G.highScore = loadHighScore();
    G.spawn = map.findScenicSpawn(G.seed);
    setupTitleWorld();
    G.mode = 'title';
    G.camera = buildCamera(computePose(1, false), 0);
    BOOT.progress = 1;
    BOOT.stage = '就绪';
    BOOT.ready = true;
    TEST.readyAt = performance.now();
    if (PARAMS.get('autostart') === '1') {
      startRun();
      applyScenario(G.scenarioName);
    } else if (G.scenarioName && G.scenarioName !== 'title') {
      startRun();
      applyScenario(G.scenarioName);
    }
    if ($bootfallback) $bootfallback.style.display = 'none';
  } catch (err) {
    console.error(err);
    BOOT.error = 'Boot failed: ' + (err && err.message ? err.message : err);
  }
}

// --------------------------------------------------------------- frame ------
let lastFrame = performance.now();
let fpsAcc = 0, fpsFrames = 0, fpsSample = 60, fpsBelow = 0, qualityCooldown = 0;
let lastUiDraw = 0;

function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (!isFinite(dt) || dt <= 0) dt = 0.016;
  dt = Math.min(0.05, dt);
  G.lastDt = dt;
  if (!G.freeze && !BOOT.error) updateGame(dt);
  if (G.freeze) G.realTime += 0;
  if (G.map && G.meshes && G.camera && !BOOT.error) {
    const drawables = collectDrawables();
    Renderer.render(G.camera, G.map, G.time, drawables, {
      damage: G.damageFlash,
      cloudWhite: G.cloudWhite,
      fade: G.fade,
      sunGlow: G.sunGlow,
      cloudOn: true,
    });
  }
  drawUIFrame();
  // fps + dynamic internal resolution
  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 1.8) {
    fpsSample = damp(fpsSample, fpsFrames / fpsAcc, 0.6, 1);
    G.fps = fpsSample;
    fpsAcc = 0; fpsFrames = 0;
    if (ADAPT_QUALITY && !FIXED_QUALITY && (G.mode === 'play' || G.mode === 'waveclear')) {
      qualityCooldown -= 1.8;
      if (fpsSample < 45 && qualityIndex < QUALITY_STEPS.length - 1 && qualityCooldown <= 0) {
        qualityIndex++;
        WORLD_H = Math.max(240, Math.round(WORLD_H * 0.86));
        qualityCooldown = 6;
        resizeAll();
      }
      fpsBelow = fpsSample < 45 ? fpsBelow + 1 : 0;
    }
  }
}

function collectDrawables() {
  const out = [];
  const p = G.player;
  const cam = G.camera;
  if (!cam) return out;
  const md = new Float32Array(16);
  const push = (mesh, pos, basis, scale, opts = {}) => {
    if (!mesh) return;
    const dist = vdist(pos, cam.pos);
    if (dist > (opts.maxDist || 7000)) return;
    const back = { x: -basis.fwd.x, y: -basis.fwd.y, z: -basis.fwd.z };
    m4basis(md, basis.right, basis.up, back, pos, scale);
    out.push({
      mesh, dist, matrix: md.slice(), alpha: opts.alpha === undefined ? 1 : opts.alpha,
      tint: opts.tint, outline: G.outlines !== false && opts.outline !== false,
    });
  };
  if (p && !p.dead && G.cockpitAlpha < 0.62) {
    push(G.meshes.player, p.pos, p.renderBasis, 1, { maxDist: 10000 });
    // under-wing stores
    const b = p.renderBasis;
    for (let i = 0; i < Math.min(4, p.missiles); i++) {
      const side = (i % 2 === 0 ? -1 : 1) * (2.2 + Math.floor(i / 2) * 1.05);
      const back = 0.8 + Math.floor(i / 2) * 1.35;
      const pos = vadd(vadd(vadd(p.pos, vmul(b.right, side)), vmul(b.up, -0.52)), vmul(b.fwd, back));
      push(G.meshes.missile, pos, b, 0.9, { maxDist: 800 });
    }
  }
  for (const e of G.enemies) {
    if (e.dead) continue;
    push(G.meshes.drone, e.pos, e.basis, 2.5, { maxDist: 6500 });
  }
  for (const g of G.ground) {
    if (g.dead) continue;
    const basis = basisFrom(g.yaw || 0, 0, 0);
    push(g.type === 'sam' ? G.meshes.sam : G.meshes.vehicle, g.pos, basis, 1, { maxDist: 6000, outline: true });
  }
  if (G.map && G.meshes.pineTree && p && !p.dead) {
    out.push(...Forest.collect(cam, p, G.meshes, { height: WORLD_H, aspect: VIEW_ASPECT, top: G.view === 0 }));
  }
  for (const m of G.missiles) {
    if (m.dead) continue;
    const sp = vlen(m.vel) || 1;
    const yaw = Math.atan2(m.vel.x, -m.vel.z);
    const pitch = Math.asin(clamp(m.vel.y / sp, -1, 1));
    const basis = basisFrom(yaw, pitch, 0);
    push(G.meshes.missile, m.pos, basis, 1, { maxDist: 3000 });
  }
  return out;
}

function drawUIFrame() {
  INPUT.uiHits.length = 0;
  setBodyClass();
  ctx.setTransform(UI_DPR, 0, 0, UI_DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, VW, VH);
  ctx.imageSmoothingEnabled = false;
  if (BOOT.error || !BOOT.ready) {
    drawLoading();
    return;
  }
  if (G.map && G.player && G.camera) {
    drawWorldOverlay();
    if (G.cockpitAlpha > 0.01) drawCockpit(G.cockpitAlpha);
    drawScreenFeedback();
  }
  if (G.mode === 'title') {
    drawTitle();
    if (G.debug) drawDebug();
    return;
  }
  if (G.mode === 'play' || G.mode === 'waveclear' || G.mode === 'paused' || G.mode === 'dying') {
    drawHUD();
  }
  if ((G.mode === 'play' || G.mode === 'waveclear') && INPUT.touchMode) drawTouchControls();
  if (G.mode === 'waveclear') drawWaveClear();
  if (G.mode === 'paused') drawPause();
  if (G.mode === 'failed') drawFailed();
  if (G.mode === 'dying') drawDying();
  if (G.debug) drawDebug();
}

function drawScreenFeedback() {
  if (G.damageFlash > 0.012) {
    const a = clamp01(G.damageFlash);
    ctx.save();
    for (let i = 0; i < 6; i++) {
      ctx.globalAlpha = a * (0.18 - i * 0.024);
      ctx.fillStyle = '#d2372f';
      ctx.fillRect(0, i * 7, VW, 7);
      ctx.fillRect(0, VH - (i + 1) * 7, VW, 7);
      ctx.fillRect(i * 9, 0, 9, VH);
      ctx.fillRect(VW - (i + 1) * 9, 0, 9, VH);
    }
    ctx.restore();
  }
  if (G.flash > 0.015) {
    rect(0, 0, VW, VH, '#fff6e8', clamp01(G.flash) * 0.32);
  }
  if (G.mode === 'dying') {
    rect(0, 0, VW, VH, 'rgba(26,5,8,0.20)');
  }
}

function drawDying() {
  const pulse = 0.55 + 0.45 * Math.sin(G.realTime * 16);

function drawDebug() {

// ------------------------------------------------------------ scenarios -----
function setViewName(name) {
  const v = name === 'top' ? 0 : (name === 'cockpit' ? 2 : 1);
  G.view = v; G.prevView = v; G.viewBlend = 1; G.chaseInit = false;
  if (v === 2) G.cockpitAlpha = 1; else G.cockpitAlpha = 0;
  if (G.player) G.camera = buildCamera(computePose(v, false), 0);
}

function ensurePlay() {
  const fresh = !G.player || G.mode === 'title' || G.mode === 'loading' || G.mode === 'failed';
  trace('ensurePlayClear', `enemies=${G.enemies.length} mode=${G.mode} fresh=${fresh}`);
  G.enemies.length = 0;
  G.ground.length = 0;
  G.missiles.length = 0;
  G.effects.length = 0;
  G.tracers.length = 0;
  G.popups.length = 0;
  G.decals.length = 0;
  G.vapor.length = 0;
  G.lock = { target: null, progress: 0, phase: 'search', tick: 0, lockTone: 0 };
  // startRun repopulates the first wave; clearing must happen before it,
  // otherwise the freshly spawned wave is wiped and can never complete.
  if (fresh) startRun();
  else G.banner = null;
  G.mode = 'play';
  G.freeze = false;
  document.body.classList.add('playing');
  document.body.classList.remove('title');
}

function placeDroneAhead(dist = 700, side = 160, dAlt = 30) {
  const p = G.player;
  if (!p) return null;
  G.waveSpawned = Math.max(0, G.waveSpawned - 1);
  const e = spawnDrone(0);
  if (!e) return null;
  const b = p.renderBasis || p.basis;
  const pos = vadd(vadd(vadd(p.pos, vmul(b.fwd, dist)), vmul(b.right, side)), { x: 0, y: dAlt, z: 0 });
  pos.y = Math.max(pos.y, G.map.heightAt(pos.x, pos.z) + 180);
  e.pos = pos;
  e.yaw = Math.atan2(p.pos.x - pos.x, -(p.pos.z - pos.z));
  e.pitch = 0; e.roll = 0;
  e.basis = basisFrom(e.yaw, 0, 0);
  e.state = 'patrol';
  e.aware = 0;
  e.speed = 105;
  return e;
}

function lookAtPoint(point, extraPitch = 0) {
  const p = G.player;
  if (!p) return;
  p.yaw = Math.atan2(point.x - p.pos.x, -(point.z - p.pos.z));
  const horiz = Math.hypot(point.x - p.pos.x, point.z - p.pos.z) || 1;
  p.pitch = clamp(Math.atan2(point.y - p.pos.y, horiz) + extraPitch, -0.85, 0.85);
  p.basis = basisFrom(p.yaw, p.pitch, 0);
  p.renderBasis = p.basis;
  G.chaseInit = false;
  G.camera = buildCamera(computePose(G.view, false), 0);
}

function placeLockTarget() {
  const p = G.player;
  if (!p) return null;
  ensurePlay();
  setViewName('chase');
  let e = placeDroneAhead(760, 0, 0);
  if (!e) return null;
  // nudge until it is visible, out of cloud and has line of sight
  const b = p.basis;
  for (let i = 0; i < 8; i++) {
    const d = 620 + i * 45;
    const side = (i % 2 ? 50 : -50) * Math.floor((i + 1) / 2);
    const pos = vadd(vadd(vadd(p.pos, vmul(b.fwd, d)), vmul(b.right, side)), { x: 0, y: -20 + i * 10, z: 0 });
    pos.y = Math.max(pos.y, G.map.heightAt(pos.x, pos.z) + 220);
    e.pos = pos;
    e.basis = basisFrom(Math.atan2(p.pos.x - pos.x, -(p.pos.z - pos.z)), 0, 0);
    if (!targetConcealed(e) && lineOfSightClear(p.pos, pos, 10)) break;
  }
  e.state = 'engage'; e.aware = 3;
  G.lock.target = e; G.lock.progress = 1; G.lock.phase = 'locked';
  G.camera = buildCamera(computePose(1, false), 0);
  return e;
}

function applyScenario(name) {
  if (!name || name === 'title') return;
  G.freeze = false;
  ensurePlay();
  if (name === 'top' || name === 'chase' || name === 'cockpit') {
    setViewName(name);
    placeDroneAhead(560, -190, 40);
    placeDroneAhead(880, 240, -10);
    placeDroneAhead(1400, 40, 100);
    G.player.pos.y = Math.max(G.player.pos.y, G.map.heightAt(G.player.pos.x, G.player.pos.z) + 720);
    G.camera = buildCamera(computePose(G.view, false), 0);
    return;
  }
  if (name === 'lock') {
    placeLockTarget();
    G.freeze = true;
    return;
  }
  if (name === 'explosion' || name === 'strike') {
    setViewName('chase');
    const p = G.player;
    const e = placeDroneAhead(560, 30, -25);
    if (e) {
      const b = p.basis;
      const at = vadd(vadd(p.pos, vmul(b.fwd, 540)), vmul(b.right, 20));
      at.y = p.pos.y - 20;
      spawnExplosion(at, 1.5, 'air', { drone: true, smoke: 16 });
      for (let i = 0; i < 7; i++) spawnDebris(vadd(at, { x: rr(-6, 6), y: rr(-4, 4), z: rr(-6, 6) }), vmul(vnorm({ x: rr(-1, 1), y: rr(-0.3, 1), z: rr(-1, 1) }), rr(40, 90)));
      e.dead = true;
      G.enemies = G.enemies.filter(x => !x.dead);
      G.flash = 0.55; G.shake = 1.2;
    }
    G.freeze = true;
    return;
  }
  if (name === 'wave') {
    setViewName('chase');
    G.wave = 2;
    G.secondary = { type: 'sam', need: 2, killed: 2, text: '摧毁 2 个防空阵地' };
    G.secondaryDone = true;
    G.mode = 'waveclear'; G.respite = 6.2;
    G.freeze = true;
    return;
  }
  if (name === 'fail') {
    setViewName('chase');
    G.score = 14850; G.wave = 4; G.stats.kills = 17; G.missionTime = 214;
    G.newHigh = true; G.highScore = Math.max(G.highScore, G.score);
    G.mode = 'failed'; G.failTimer = 2;
    G.freeze = false;
    return;
  }
}

function simulate(seconds, opts = {}) {
  const result = {
    seconds: 0, steps: 0, errors: [], fails: 0, restarts: 0,
    maxWave: G.wave, kills: 0, shots: 0, hits: 0, minEnemyClearance: 1e9,
    maxEnemyStuck: 0, maxWaveDuration: 0, deaths: 0, endMode: G.mode,
    minPlayerAgl: 1e9, maxEnemiesAirborne: 0, nan: 0, waveTimes: [],
  };
  const started = performance.now();
  try {
    G.trace = true;
    if (!G.player || opts.continueRun !== true) startRun();
    result.startEnemies = G.enemies.length;
    result.startWaveSpawned = G.waveSpawned;
    trace('simStart', `enemies=${G.enemies.length} spawned=${G.waveSpawned} total=${G.waveTotal} cap=${G.activeCap}`);
    G.mode = 'play';
    G.freeze = true;
    setViewName('top');
    INPUT.mx = VW / 2; INPUT.my = VH / 2;
    const h = 1 / 40;
    let t = 0, lastFire = -99, lastFlare = -99, nextJink = 3, jinkT = 0;
    let waveStart = 0, lastWave = G.wave, wasFailed = false;
    const watches = new Map();
    let stepGuard = 0;
    while (t < seconds) {
      const p = G.player;
      if (!p) break;
      const dt = h;
      stepGuard++;
      // bot: top-down pilot chases the nearest target, fires when locked
      let target = null, best = 1e9;
      for (const e of G.enemies) {
        if (e.dead || e.leaving) continue;
        const d = vdist(e.pos, p.pos);
        if (d < best) { best = d; target = e; }
      }
      let mx = VW / 2, my = VH / 2;
      if (target) {
        const s = {};
        if (projectToScreen(target.pos, s) && s.w > 0) {
          mx = clamp(s.x + rr(-14, 14), 10, VW - 10);
          my = clamp(s.y + rr(-14, 14), 10, VH - 10);
        } else {
          const bearing = Math.atan2(target.pos.x - p.pos.x, -(target.pos.z - p.pos.z));
          mx = VW / 2 + Math.sin(bearing) * 90;
          my = VH / 2 - Math.cos(bearing) * 90;
        }
      }
      if (Math.random() < 0.008) { nextJink = t; jinkT = 0.45; }
      if (t - nextJink < jinkT) {
        mx += rr(-120, 120); my += rr(-120, 120);
      }
      INPUT.mx = clamp(mx, 2, VW - 2);
      INPUT.my = clamp(my, 2, VH - 2);
      const threat = G.threatList.length ? G.threatList.reduce((a, b) => a.d < b.d ? a : b) : null;
      const alt = p.agl < 260 ? 1 : (p.pos.y > 1900 && Math.random() < 0.01 ? -1 : 0);
      const burn = (target && best > 1800) || (threat && threat.d < 700);
      G.testInput = { sx: 0, sy: 0, burn, alt, mx: INPUT.mx, my: INPUT.my };
      // periodic actions (direct API = deterministic)
      if (G.lock.phase === 'locked' && p.missiles > 0 && t - lastFire > 2.6 && best < 1900) {
        firePlayerMissile(); lastFire = t;
      }
      if (threat && threat.d < 900 && p.flares > 0 && t - lastFlare > 3.2) {
        tryFlares(); lastFlare = t;
      }
      if (p.rollCd <= 0 && threat && threat.d < 480 && Math.random() < 0.02) triggerBarrelRoll();
      // keep the fight fed if wave logic stalls
      updateGame(dt);
      t += dt;
      if (G.mode === 'failed') {
        if (!wasFailed) { result.fails++; result.deaths++; wasFailed = true; }
        if (G.failTimer > 1.0) { restartRun(); result.restarts++; G.mode = 'play'; setViewName('top'); wasFailed = false; }
      } else if (G.mode === 'play') wasFailed = false;

    if (e.detail === 0 && !skyKeyClicks.has(button)) {
      if (action === 'gun') firePlayerGuns();
      else {
        skyHold(button, 'assistive-boost');
        clearTimeout(skyBoostTimer);
        skyBoostTimer = setTimeout(() => {
          skyPointerHolds.delete('assistive-boost');
          skyRefreshHolds(); skyBoostTimer = 0;
        }, 1200);
        skyReport('短时加速1.2秒；按住Shift可持续加速。');
      }
    }
    skyKeyClicks.delete(button);
  } else if (action === 'roll') triggerBarrelRoll();
  else if (action === 'missile') firePlayerMissile();
  else if (action === 'view') cycleView();
  else if (action === 'pause') togglePause();
  skySync();
});

const skyDrawUIFrame = drawUIFrame;
drawUIFrame = function () { skyDrawUIFrame(); skySync(); };
window.__SKY = { start: skyStart, home: skyHome, restart: () => startRun(flightMode), get flightMode() { return flightMode; }, sync: skySync };
worldHInit = false;
resizeAll();
if (window.ResizeObserver) new window.ResizeObserver(() => resizeAll()).observe(skyStage);


})();
</script>
