  // base basis of the airframe (flight), then a render basis with barrel-roll spin
  p.basis = basisFrom(p.yaw, p.pitch, p.roll);
  const rp = p.roll + p.spin;
  p.renderBasis = basisFrom(p.yaw, p.pitch, rp);

  let pose;
  if (G.viewBlend < 1 && G.prevView !== G.view) {
    const a = computePose(G.prevView, false);
    const b = computePose(G.view, false);
    const t = smoothstep(0, 1, clamp01(G.viewBlend));
    pose = {
      pos: vlerp(a.pos, b.pos, t),
      target: vlerp(a.target, b.target, t),
      up: vnorm(vlerp(a.up, b.up, t)),
      fov: lerp(a.fov, b.fov, t)
    };
    G.viewBlend = Math.min(1, G.viewBlend + dt / 1.0);
  } else {
    pose = computePose(G.view, true);
  }
  // clamp camera above the terrain even in a blended pose
  if (G.map) {
    const gh = Math.max(G.map.heightAt(pose.pos.x, pose.pos.z), 0);
    if (pose.pos.y < gh + 3) pose.pos.y = gh + 3;
  }
  const shake = G.shake * (G.view === 2 ? 0.45 : 1);
  G.camera = buildCamera(pose, shake);

  // cockpit overlay fades with view intent
  const targetCockpit = G.view === 2 ? 1 : 0;
  const rate = G.viewBlend < 1 ? 5.5 : 8;
  G.cockpitAlpha = damp(G.cockpitAlpha, targetCockpit, rate, dt);
  if (G.cockpitAlpha < 0.01) G.cockpitAlpha = 0;
}

function projectToScreen(p, out = {}) {
  if (!G.camera) return false;
  const ok = projectPoint(p, G.camera.vp, out);
  if (!ok) return false;
  out.visible = out.x > -40 && out.x < VW + 40 && out.y > -40 && out.y < VH + 40;
  out.dist = out.w;
  return true;
}

function screenPixelPerMetre(dist) {
  return VH / (2 * Math.max(1, dist) * Math.tan((G.camera ? G.camera.fov : 1) * 0.5));
}

function lineOfSightClear(a, b, steps = 14) {
  if (!G.map) return true;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = lerp(a.x, b.x, t), y = lerp(a.y, b.y, t), z = lerp(a.z, b.z, t);
    const h = Math.max(G.map.heightAt(x, z), 0);
    if (y < h + 1.5) return false;
  }
  return true;
}

// ----------------------------------------------------------- flight ---------
function readSteering() {
  const p = G.player;
  const topView = G.view === 0;
  const mouseBlend = G.testInput || TOUCH.active || (INPUT.touchMode && !Number.isFinite(INPUT.mouseSteerAge)) ? 1
    : 1 - clamp((INPUT.mouseSteerAge - 0.14) / (MOUSE_STEER_TIMEOUT - 0.14), 0, 1);
  let sx = 0, sy = 0, burn = false, alt = 0, turn = 0;
  const keyLeft = INPUT.keys.has('KeyA') || INPUT.keys.has('ArrowLeft');
  const keyRight = INPUT.keys.has('KeyD') || INPUT.keys.has('ArrowRight');
  const keyUp = INPUT.keys.has('KeyW') || INPUT.keys.has('ArrowUp');
  const keyDown = INPUT.keys.has('KeyS') || INPUT.keys.has('ArrowDown');
  if (G.testInput) {
    const ti = G.testInput;
    sx = ti.sx || 0; sy = ti.sy || 0; burn = !!ti.burn; alt = ti.alt || 0; turn = ti.turn || 0;
    if (ti.mx !== undefined) INPUT.mx = ti.mx;
    if (ti.my !== undefined) INPUT.my = ti.my;
  } else {
    if (!topView) {
      const cx = VW * 0.5, cy = VH * 0.52;
      sx = (INPUT.mx - cx) / (VW * 0.30);
      sy = (cy - INPUT.my) / (VH * 0.31);
      const dz = 0.055;
      if (Math.abs(sx) < dz) sx = 0; else sx = sign(sx) * (Math.abs(sx) - dz) / (1 - dz);
      if (Math.abs(sy) < dz) sy = 0; else sy = sign(sy) * (Math.abs(sy) - dz) / (1 - dz);
      sx = clamp(sx, -1, 1); sy = clamp(sy, -1, 1);
      sx *= mouseBlend; sy *= mouseBlend;
      // WASD takes over while held; mouse steering resumes on release
      const kx = (keyRight ? 1 : 0) - (keyLeft ? 1 : 0);
      const ky = (keyUp ? 1 : 0) - (keyDown ? 1 : 0);
      if (kx) sx = kx;
      if (ky) sy = ky;
    } else {
      turn = (keyRight ? 1 : 0) - (keyLeft ? 1 : 0);
    }
    alt = (keyUp ? 1 : 0) - (keyDown ? 1 : 0);
  }
  if (G.touchStick) {
    sx = G.touchStick.x; sy = G.touchStick.y;
  }
  const holdBurn = INPUT.keys.has('ShiftLeft') || INPUT.keys.has('ShiftRight') || INPUT.touchBurn;
  burn = burn || holdBurn;
  return { sx, sy, burn, alt, turn, topView, mouseBlend };
}

function updateFlight(dt) {
  const p = G.player;
  if (!p || p.dead) return;
  if (INPUT.touchMode && !TOUCH.active) {
    // ease the virtual stick back to neutral after a finger lifts
    INPUT.mx = damp(INPUT.mx, VW / 2, 2.6, dt);
    INPUT.my = damp(INPUT.my, VH * 0.52, 2.6, dt);
  }
  if (Number.isFinite(INPUT.mouseSteerAge)) INPUT.mouseSteerAge += dt;
  const st = readSteering();
  p.steering = st;
  G.lastDt = dt;

  // afterburner / fuel
  const wantBurn = st.burn && p.fuel > 0.5 && G.mode !== 'failed';
  p.burning = wantBurn;
  const targetSpeed = wantBurn ? SPEED_BURN : SPEED_CRUISE;
  if (p.burning) {
    p.speed = Math.min(SPEED_BURN, p.speed + 62 * dt);
    p.fuel = Math.max(0, p.fuel - 15.5 * dt);
  } else {
    p.speed = damp(p.speed, SPEED_CRUISE, p.speed > SPEED_CRUISE ? 0.75 : 0.55, dt);
    p.fuel = Math.min(100, p.fuel + 10.5 * dt);
  }
  const speedFactor = clamp(125 / Math.max(80, p.speed), 0.56, 1.15);

  if (st.topView) {
    // top-down: A/D turns, W/S trims altitude; the cursor still steers
    const maxTurn = 1.85 * speedFactor;
    let turn = 0;
    if (st.turn) {
      turn = st.turn * maxTurn;
      const targetRoll = -st.turn * BANK_MAX * 0.8;
      p.roll = angleLerp(p.roll, targetRoll, 1 - Math.exp(-5 * dt));
    } else {
      const dx = (INPUT.mx - VW * 0.5) * st.mouseBlend, dy = (INPUT.my - VH * 0.5) * st.mouseBlend;
      let desired = p.yaw;
      if (G.testInput && G.testInput.heading !== undefined) desired = G.testInput.heading;
      else if (Math.hypot(dx, dy) > 12) desired = Math.atan2(dx, -dy);
      const dy2 = wrapAngle(desired - p.yaw);
      turn = clamp(dy2 * 3.0, -maxTurn, maxTurn);
      const targetRoll = clamp(dy2 * 1.4, -BANK_MAX, BANK_MAX);
      p.roll = angleLerp(p.roll, targetRoll, 1 - Math.exp(-5 * dt));
    }
    p.yaw = wrapAngle(p.yaw + turn * dt);
    p.yawRate = turn;
    let targetPitch = 0;
    if (st.alt > 0) targetPitch = 0.46;
    else if (st.alt < 0) targetPitch = -0.46;
    p.pitch = damp(p.pitch, targetPitch, 3, dt);
    p.pitchRate = 0;
    p.gLoad = clamp(1 + Math.abs(turn) * p.speed / 9.81 * 0.10, 1, 6);
  } else {
    const targetRoll = -st.sx * BANK_MAX;
    p.roll = angleLerp(p.roll, targetRoll, 1 - Math.exp(-6.5 * dt));
    const oldPitch = p.pitch;
    const pitchRate = st.sy * 1.08;
    if (Math.abs(st.sy) > 0.03) p.pitch += pitchRate * dt;
    else p.pitch = damp(p.pitch, 0, 2.2, dt);
    p.pitch = clamp(p.pitch, -1.02, 1.02);
    p.pitchRate = (p.pitch - oldPitch) / Math.max(dt, 1e-6);
    if (Math.abs(st.sx) < 0.03 && Math.abs(p.roll) < 0.25) p.roll *= 1 - 1.6 * dt;
    const turnRate = 1.28 * speedFactor * (p.burning ? 0.70 : 1) * (1 - Math.abs(p.pitch) * 0.25);
    const yawDelta = -Math.sin(p.roll) * turnRate;
    p.yaw = wrapAngle(p.yaw + yawDelta * dt);
    p.yawRate = yawDelta;
    p.gLoad = clamp(1 + Math.abs(yawDelta) * p.speed / 9.81 * 0.42 + Math.abs(pitchRate) * 0.6, 1, 9);
  }
  p.basis = basisFrom(p.yaw, p.pitch, p.roll);

  // barrel roll
  if (p.rollT > 0) {
    p.rollT -= dt;
    p.invuln = Math.max(p.invuln, Math.min(0.6, p.rollT));
    const prog = 1 - p.rollT / 0.72;
    p.spin = (p.rollDir || 1) * Math.PI * 2 * (prog * prog * (3 - 2 * prog));
    if (p.rollT <= 0) { p.rollT = 0; p.spin = 0; }
  }
  if (p.rollCd > 0) p.rollCd -= dt;
  if (p.invuln > 0) p.invuln -= dt;
  if (p.flareCd > 0) p.flareCd -= dt;

  // missiles reload
  for (let i = p.reloads.length - 1; i >= 0; i--) {
    p.reloads[i] -= dt;
    if (p.reloads[i] <= 0) {
      p.reloads.splice(i, 1);
      p.missiles = Math.min(4, p.missiles + 1);
    }
  }

  // integrate
  const fwd = p.basis.fwd;
  p.pos.x += fwd.x * p.speed * dt;
  p.pos.y += fwd.y * p.speed * dt;
  p.pos.z += fwd.z * p.speed * dt;

  // terrain awareness
  const hHere = G.map.heightAt(p.pos.x, p.pos.z);
  const surf = Math.max(hHere, 0);
  p.groundH = hHere;
  p.agl = p.pos.y - hHere;
  p.terrainWarn = p.agl < 130;
  const aheadDist = Math.max(70, p.speed * 1.1);
  const af = vadd(p.pos, vmul(fwd, aheadDist));
  const aheadH = G.map.heightAt(af.x, af.z);
  if (aheadH > p.pos.y - 35) {
    p.pitch = Math.max(p.pitch, 0.28);
    p.terrainWarn = true;
  }
  if (p.pos.y < surf + 24) {
    p.pos.y = Math.max(p.pos.y, surf + 24);
    p.pitch = Math.max(p.pitch, 0.36);
    p.terrainWarn = true;
    if (p.agl < 12) {
      damagePlayer(9 * dt, 'terrain', true);
      if (Math.random() < 0.3) spawnSparks(vadd(p.pos, { x: 0, y: -8, z: 0 }), 2, '#ffd27a');
      G.shake = Math.max(G.shake, 0.5);
    }
  }
  if (p.pos.y < surf + 6) { p.pos.y = surf + 6; }
  if (p.pos.y > 2400) {
    p.pos.y = 2400;
    p.pitch = Math.min(p.pitch, 0);
  }

  // water skimming + spray
  const overWater = hHere < -0.5;
  p.skimming = overWater && p.agl < 16 && p.speed > 45;
  if (p.skimming) {
    p.sprayTimer -= dt;
    if (p.sprayTimer <= 0) {
      p.sprayTimer = 0.025;
      spawnSpray(vadd(p.pos, { x: 0, y: -p.agl, z: 0 }));
    }
    if (Math.random() < 0.2) addWingTrail(p.pos, 0, true);
  }

  // clouds
  const dens = G.map.cloudDensity(p.pos.x, p.pos.y, p.pos.z);
  p.inCloud = dens;
  G.cloudWhite = damp(G.cloudWhite, smoothstep(0.16, 0.7, dens) * 0.85, 7, dt);

  // shield regen
  if (p.shield < PLAYER_MAX_SHIELD && G.time - p.lastHit > 3.8 && G.mode === 'play') {
    p.shield = Math.min(PLAYER_MAX_SHIELD, p.shield + 4.2 * dt);
  }

  // vapour trails at high G / high speed
  p.vaporTimer -= dt;
  const vap = (p.gLoad > 3.6 || p.speed > 178 || p.rollT > 0) && G.view !== 2;
  if (vap && p.vaporTimer <= 0) {
    p.vaporTimer = 0.018;
    const b = p.renderBasis;
    addWingTrail(vadd(vadd(p.pos, vmul(b.right, 4.9)), vmul(b.fwd, 0.3)), 1);
    addWingTrail(vadd(vadd(p.pos, vmul(b.right, -4.9)), vmul(b.fwd, 0.3)), -1);
  }

  // engine plume puffs
  p.plumeTimer -= dt;
  if (p.plumeTimer <= 0) {
    p.plumeTimer = 0.05;
    // handled by draw; nothing simulated
  }

  p.speedDisplay = p.speed;

  // audio + warnings
  AudioSys.updateEngine(G.mode === 'play' || G.mode === 'waveclear', p.burning ? 1 : clamp01((p.speed - 90) / 120), p.shield < 30);
  if (G.time - G.lastLowWarn > 2.0 && (p.agl < 80 || p.shield < 22 || p.fuel < 15)) {
    G.lastLowWarn = G.time;
    AudioSys.lowWarn();
  }
  if (G.mode === 'play') G.missionTime += dt;
}

function triggerBarrelRoll() {
  if (G.mode !== 'play') return;
  const p = G.player;
  if (!p || p.dead || p.rollCd > 0) return;
  p.rollT = 0.72;
  p.rollDir = (p.roll < 0 ? 1 : -1) || 1;
  p.rollCd = 1.05;
  p.spin = 0.001;
  G.shake = Math.max(G.shake, 0.18);
  AudioSys.flare();
  // barrel rolls break missile locks and confuse inbound missiles
  for (const m of G.missiles) {
    if (m.owner !== 'enemy' || m.dead) continue;
    const d = vdist(m.pos, p.pos);
    if (d < 1500 && Math.random() < 0.55 + 0.25 * (1 - d / 1500)) {
      m.lost = true;
      m.lostTimer = 1.2;
      m.vel = vadd(m.vel, { x: rr(-30, 30), y: rr(-10, 10), z: rr(-30, 30) });
    }
  }
  // pilot style above the canopy
  for (let i = 0; i < 2; i++) addWingTrail(vadd(p.pos, vmul(p.basis.right, i ? 4.9 : -4.9)), i ? 1 : -1, true);
}

// ------------------------------------------------------------ life cycle ----
function beginWave(n) {
  G.wave = n;
  G.waveKills = 0;
  G.waveSpawned = 0;
  G.waveElapsed = 0;
  G.waveTimer = 0;
  G.respite = 0;
  trace('beginWave', n);
  prepareWave(n);
  G.banner = {
    title: `第 ${pad(n, 2)} 波`,
    sub: G.secondary ? G.secondary.text : '拦截敌机',
    t: 0, life: 3.4
  };
  G.mode = 'play';
  document.body.classList.add('playing');
  document.body.classList.remove('title');
  AudioSys.waveStart();
}

function completeWave() {
  if (G.mode !== 'play') return;
  trace('completeWave', G.wave);
  G.mode = 'waveclear';
  G.respite = 8.0;
  if (G.player) {
    G.player.missiles = 4;
    G.player.reloads.length = 0;
    G.player.flares = Math.max(G.player.flares, 3);
  }
  G.lock = { target: null, progress: 0, phase: 'search', tick: 0, lockTone: 0 };
  // secondary bonus
  const sec = G.secondary;
  G.secondaryDone = isSecondaryComplete();
  if (G.secondaryDone) G.score += 350 + G.wave * 25;
  G.score += 200 + G.wave * 20;
  G.banner = null;
  AudioSys.waveClear();
  // enemy missiles fizzle out
  for (const m of G.missiles) {
    if (m.owner === 'enemy' && !m.dead) {
      m.dead = true;
      spawnExplosion(m.pos, 0.35, 'air', { smoke: 3 });
    }
  }
  for (const e of G.enemies) e.leaving = true;
  saveHighScore();
}

function isSecondaryComplete() {
  const s = G.secondary;
  if (!s) return false;
  if (s.type === 'sam') return s.killed >= s.need;
  if (s.type === 'vehicle') return s.killed >= s.need;
  if (s.type === 'low') return !!s.done;
  if (s.type === 'shield') return G.player && G.player.shield >= s.need;
  if (s.type === 'lowmissile') return !!s.done;
  return false;
}

function secondaryProgressText() {
  const s = G.secondary;
  if (!s) return '';
  if (s.type === 'sam') return `${Math.min(s.killed, s.need)}/${s.need} 防空阵地`;
  if (s.type === 'vehicle') return `${Math.min(s.killed, s.need)}/${s.need} 装甲车`;
  if (s.type === 'low') return s.done ? '低空击杀：完成' : '低空击杀';
  if (s.type === 'shield') return `保持 ${s.need}% 护盾`;
  return s.text;
}

// --------------------------------------------------------------- frame ------
function updateGame(dtRaw) {
  const raw = Math.min(dtRaw, 0.05);
  G.realTime += raw;
  if (G.mode === 'paused' || G.mode === 'loading') {
    if (G.mode === 'paused') G.fade = damp(G.fade, 0.15, 8, raw);
    return;
  }
  let scale = 1;
  if (G.hitStop > 0) {
    G.hitStop -= raw;
    scale = 0.22;
  }
  const dt = raw * scale;
  G.time += dt;
  G.shake = damp(G.shake, 0, 4.5, raw);
  G.damageFlash = damp(G.damageFlash, 0, 5.5, raw);
  G.flash = damp(G.flash, 0, 7.5, raw);
  G.fade = damp(G.fade, 0, 6, raw);
  if (G.banner) G.banner.t += raw;

  if (G.mode === 'title') {
    updateTitle(dt);
  } else if (G.mode === 'play') {
    updateFlight(dt);
    updatePlayerGuns(dt);
    updateLockOn(dt);
    updateMissiles(dt);
    updateEnemies(dt);
    updateGround(dt);
    updateEffects(dt);
    updateVapor(dt);
    updateWaveLogic(dt);
    computeThreats();
    G.missionTime += 0;
    G.waveElapsed += dt;
    updateCamera(dt);
  } else if (G.mode === 'waveclear') {
    updateFlight(dt);
    updateEffects(dt);
    updateVapor(dt);
    updateEnemies(dt);
    updateMissiles(dt);
    updateGround(dt);
    updateCamera(dt);
    G.respite -= dt;
    const p = G.player;
    if (p) {
      p.shield = Math.min(PLAYER_MAX_SHIELD, p.shield + 18 * dt);
      p.fuel = Math.min(100, p.fuel + 22 * dt);
      p.invuln = Math.max(p.invuln, 0.2);
    }
    G.cloudWhite = damp(G.cloudWhite, 0, 4, dt);
    if (G.respite <= 0) {
      G.player.shield = PLAYER_MAX_SHIELD;
      G.player.fuel = 100;
      G.player.missiles = 4;
      G.player.reloads.length = 0;
      G.player.flares = 3;
      beginWave(G.wave + 1);
    }
  } else if (G.mode === 'dying') {
    G.dyingTimer -= raw;
    updateEffects(dt);
    updateMissiles(dt);
    updateVapor(dt);
    updateEnemies(dt * 0.6);
    updateCamera(dt);
    if (G.dyingTimer <= 0) failMission();
  } else if (G.mode === 'failed') {
    updateEffects(raw * 0.7);
    updateVapor(raw * 0.5);
    updateEnemies(raw * 0.4);
    updateCamera(raw);
    G.failTimer += raw;
    G.cloudWhite = damp(G.cloudWhite, 0, 3, raw);
  }
  // UI bookkeeping
  G.warnLamp += raw;
  if (G.banner && G.banner.t > G.banner.life + 0.6) G.banner = null;
  if (G.viewBlend < 1 && G.prevView === G.view) G.viewBlend = 1;
}

function updateTitle(dt) {
  G.titleTime += dt;
  const p = G.player;
  if (!p) return;
  // serene autopilot: follow the terrain, gentle S-turns
  const t = G.titleTime;
  p.yaw = wrapAngle((G.playerTitleYaw || 0.6) + Math.sin(t * 0.085) * 0.32 + Math.sin(t * 0.031 + 1.4) * 0.15);
  const gh = G.map.heightAt(p.pos.x, p.pos.z);
  const targetAlt = Math.max(gh + 320, 520);
  p.pitch = clamp((targetAlt - p.pos.y) / 900, -0.10, 0.10);
  p.roll = Math.sin(t * 0.6) * 0.07;
  p.speed = 92;
  p.basis = basisFrom(p.yaw, p.pitch, p.roll);
  p.renderBasis = p.basis;
  const fwd = p.basis.fwd;
  p.pos.x += fwd.x * p.speed * dt;
  p.pos.z += fwd.z * p.speed * dt;
  p.pos.y += fwd.y * p.speed * dt;
  if (p.pos.y < gh + 160) p.pos.y = gh + 160;
  if (G.map.heightAt(p.pos.x, p.pos.z) > p.pos.y - 60) p.pitch = 0.2;
  // subtle trail
  if (Math.random() < dt * 20) addWingTrail(vadd(p.pos, vmul(p.basis.right, -4.9)), -1);
  updateCamera(dt);
  updateEffects(dt);
  updateVapor(dt);
  G.cloudWhite = 0;
}

function updateWaveLogic(dt) {
  const s = G.secondary;
  if (s && s.type === 'shield') s.current = G.player.shield;
  if (G.waveKills >= G.waveTotal && G.mode === 'play') {
    completeWave();
    return;
  }
  // stream in replacements while the wave is incomplete
  const active = G.enemies.filter(e => !e.dead && !e.leaving).length;
  G.spawnTimer -= dt;
  if (active < G.activeCap && G.waveKills + active < G.waveTotal && G.spawnTimer <= 0) {
    G.spawnTimer = Math.max(0.8, 2.6 - G.wave * 0.12);
    spawnDrone();
  }
}

// --------------------------------------------------------------- threats ----
function computeThreats() {
  const p = G.player;
  G.threatList.length = 0;
  if (!p || p.dead || !G.camera) return;
  for (const m of G.missiles) {
    if (m.dead || m.owner !== 'enemy') continue;
    const d = vdist(m.pos, p.pos);
    if (d > 2400) continue;
    const sp = {};
    let ang;
    if (projectToScreen(m.pos, sp) && sp.visible) {
      ang = Math.atan2(sp.y - VH / 2, sp.x - VW / 2);
    } else {
      const dir = vsub(m.pos, p.pos);
      ang = Math.atan2(dir.x, -dir.z) - p.yaw;
    }
    G.threatList.push({ m, d, ang });
  }
  // warning audio
  if (G.threatList.length && G.realTime - G.lastWarn > 0.8) {
    G.lastWarn = G.realTime;
    AudioSys.missileWarning();
  }
}

// --------------------------------------------------------------- damage -----
function damagePlayer(amount, source, silent = false) {
  const p = G.player;
  if (!p || p.dead) return;
  if (p.invuln > 0 && source !== 'terrain') return;
  p.shield -= amount;
  p.lastHit = G.time;
  G.stats.dmg += amount;
  if (!silent) {
    G.damageFlash = Math.min(1, 0.65 + amount / 50);
    addShake(clamp(0.45 + amount * 0.012, 0.45, 1.4));
    AudioSys.shieldHit();
  }
  spawnSparks(p.pos, 4 + Math.floor(amount / 8), '#ffcf8a');
  if (p.shield <= 0) {
    p.shield = 0;
    killPlayer();
  }
}

function tryFlares() {
  const p = G.player;
  if (!p || p.dead || G.mode !== 'play') return;
  if (G.realTime - G.lastFlareTime < 0.3) return;
  if (p.flares <= 0 || p.flareCd > 0) {
    AudioSys.uiTick();
    return;
  }
  G.lastFlareTime = G.realTime;
  p.flares--;
  p.flareCd = 7;
  const b = p.basis;
  for (let i = 0; i < 6; i++) {
    const off = vadd(vmul(b.right, (i - 2.5) * 3.4), vmul(b.up, -1.4));
    spawnFlare(vadd(p.pos, off), vmul(b.fwd, -18));
  }
  addShake(0.25);
  AudioSys.flare();
  // decoy enemy missiles
  for (const m of G.missiles) {
    if (m.owner !== 'enemy' || m.dead) continue;
    if (vdist(m.pos, p.pos) < 1600 && Math.random() < 0.8) {
      m.decoy = true;
      m.lost = true;
      m.lostTimer = 1.4;
    }
  }
}

// --------------------------------------------------------------- scoring ----
function styleTags(agl, inCloud, burning) {
  const tags = [];
  let bonus = 0;
  if (agl < 45) { tags.push('LOW KILL'); bonus += 75; }
  if (inCloud > 0.3) { tags.push('CLOUD KILL'); bonus += 50; }
  if (burning) { tags.push('BURN KILL'); bonus += 40; }
  return { tags, bonus };
}

function awardKill(kind, pos, opts = {}) {
  const p = G.player;
  const base = kind === 'drone' ? 100 + G.wave * 15 : kind === 'sam' ? 180 : 90;
  const now = G.time;
  if (now - G.lastKillTime < 1.6) G.combo = Math.min(4, G.combo + 1);
  else G.combo = 1;
  G.lastKillTime = now;
  let points = base;
  let tags = [];
  if (kind === 'drone' && p) {
    const st = styleTags(p.agl, p.inCloud, p.burning);
    points += st.bonus;
    tags = st.tags;
    if (st.tags.includes('LOW KILL') && G.secondary && G.secondary.type === 'low') G.secondary.done = true;
    if (p.skimming && G.secondary && G.secondary.type === 'lowmissile') G.secondary.done = true;
  }
  points *= G.combo;
  G.score += points;
  if (kind === 'drone') { G.stats.kills++; G.waveKills++; }
  if (kind === 'sam') { G.stats.sam++; if (G.secondary && G.secondary.type === 'sam') G.secondary.killed++; }
  if (kind === 'vehicle') { G.stats.veh++; if (G.secondary && G.secondary.type === 'vehicle') G.secondary.killed++; }
  const tagZh = { 'LOW KILL': '低空击杀', 'CLOUD KILL': '云中击杀', 'BURN KILL': '加力击杀' };
  const comboZh = G.combo === 2 ? '双杀' : G.combo === 3 ? '三杀' : '多杀';
  const pop = {
    pos: vcopy(pos),
    text: `+${points}`,
    tag: G.combo > 1 ? comboZh : (tagZh[tags[0]] || ''),
    color: G.combo > 1 ? '#ffd67a' : (tags.length ? '#ffe9ae' : '#f0c05a'),
    life: 1.8,
    t: 0
  };
  G.popups.push(pop);
  if (G.popups.length > 14) G.popups.shift();
  if (G.score > G.highScore) { G.highScore = Math.floor(G.score); saveHighScore(); }
  G.flash = Math.max(G.flash, kind === 'drone' ? 0.22 : 0.16);
  G.hitStop = Math.max(G.hitStop, kind === 'drone' ? 0.055 : 0.03);
  if (G.secondary && G.secondary.type === 'lowmissile') {
    // not used yet; reserved
  }
}


// ===== 42_combat.js =====
// ---------------------------------------------------------------------------
// COMBAT — drones, ground targets, missiles, lock-on, effects, scoring hooks.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------- waves -----
function chooseSecondary(n) {
  const roll = rng();
  if (n === 1) {
    if (roll < 0.55) return { type: 'vehicle', need: 2, killed: 0, text: '摧毁 2 辆装甲车' };
    return { type: 'low', need: 1, done: false, text: '在 45 米以下取得击杀' };
  }
  if (roll < 0.28) {
    const need = 1 + Math.min(2, Math.floor(n / 2));
    return { type: 'sam', need, killed: 0, text: `摧毁 ${need} 个防空阵地` };
  }
  if (roll < 0.55) {
    const need = 2 + Math.min(2, Math.floor(n / 3));
    return { type: 'vehicle', need, killed: 0, text: `摧毁 ${need} 辆装甲车` };
  }
  if (roll < 0.78) return { type: 'low', need: 1, done: false, text: '在 45 米以下取得击杀' };
  const need = Math.min(85, 60 + n);
  return { type: 'shield', need, done: false, text: `以 ${need}% 护盾完成本波` };
}

function prepareWave(n) {
  trace('prepareWave', `n=${n} total=${Math.min(9, 3 + n)}`);
  G.enemies.length = 0;
  G.ground.length = 0;
  G.missiles.length = 0;
  G.lock = { target: null, progress: 0, phase: 'search', tick: 0, lockTone: 0 };
  G.waveSpawned = 0;
  G.waveKills = 0;
  G.activeCap = Math.min(5, 3 + Math.floor((n - 1) / 2));
  G.waveTotal = Math.min(9, 3 + n);
  G.secondary = chooseSecondary(n);
  G.secondaryDone = false;
  G.spawnTimer = 1.6;

  // SAM threats. Higher waves get an extra site.
  let sams = 1 + Math.min(2, Math.floor(n / 3));
  if (G.secondary.type === 'sam') sams += G.secondary.need;
  for (let i = 0; i < sams; i++) spawnGroundTarget('sam', i < 2 ? [700, 1900] : [1000, 2600]);
  if (G.secondary.type === 'vehicle') {
    for (let i = 0; i < G.secondary.need; i++) spawnGroundTarget('vehicle', [600, 2100]);
  }
  const initial = Math.min(G.activeCap, G.waveTotal);
  for (let i = 0; i < initial; i++) spawnDrone(i);
  trace('afterInitial', `enemies=${G.enemies.length} spawned=${G.waveSpawned} initial=${initial}`);
  G.warningLamp = 0;
}

function spawnGroundTarget(type, range) {
  const p = G.player;
  let spot = null;
  for (let tries = 0; tries < 40 && !spot; tries++) {
    const cand = findFlatSpot(G.map, p.pos.x, p.pos.z, range[0], range[1], 0.22, 8, 460, 60);
    if (!cand) continue;
    let clear = true;
    for (const g of G.ground) {
      if (Math.hypot(g.pos.x - cand.x, g.pos.z - cand.z) < 260) { clear = false; break; }
    }
    if (!clear) continue;
    // keep the base footprint out of water
    let minH = 1e9;
    for (const [ox, oz] of [[0, 0], [10, 0], [-10, 0], [0, 10], [0, -10]]) minH = Math.min(minH, G.map.heightAt(cand.x + ox, cand.z + oz));
    if (minH < 3) continue;
    spot = cand;
  }
  if (!spot) return null;
  const yaw = Math.atan2(p.pos.x - spot.x, -(p.pos.z - spot.z)) + rr(-0.4, 0.4);
  const g = {
    type, kind: type,
    pos: { x: spot.x, y: spot.h, z: spot.z },
    yaw, hp: type === 'sam' ? 100 : 80, dead: false,
    fireCd: rr(3.5, 6.5), maxLaunch: 3, activeMissiles: 0,
    turretScan: rr(0, TAU), isGround: true, radius: type === 'sam' ? 7 : 4,
    flashT: 0,
  };
  G.ground.push(g);
  return g;
}

function spawnDrone(index = 0) {
  if (G.waveSpawned >= G.waveTotal) return null;
  const p = G.player;
  const ang = rr(0, TAU);
  const dist = rr(1250, 2300);
  const x = p.pos.x + Math.sin(ang) * dist;
  const z = p.pos.z - Math.cos(ang) * dist;
  const h = Math.max(0, G.map.heightAt(x, z));
  const alt = Math.max(h + 200, Math.min(p.pos.y + rr(-90, 90), CLOUD_BASE - 160));
  const e = {
    kind: 'drone', isGround: false,
    pos: { x, y: alt, z },
    yaw: Math.atan2(p.pos.x - x, -(p.pos.z - z)),
    pitch: 0, roll: 0, speed: 108, energy: 100,
    hp: DRONE_MAX_HP, dead: false, aware: 0, state: 'patrol', fleeT: 0,
    missileCd: rr(3.0, 7.0), gunCd: rr(1, 2.5), gunBurst: 0,
    losTimer: rr(0, 0.3), los: true, age: 0,
    anchor: { x: x + rr(-500, 500), y: alt, z: z + rr(-500, 500) },
    orbit: rr(0, TAU), orbitSpeed: rr(0.12, 0.28) * (rng() < 0.5 ? 1 : -1),
    showIndex: index, evadeT: 0, leaving: false, missileCount: 0,
    engineSeed: rr(0, 10), radius: 7,
    basis: null,
  };
  e.basis = basisFrom(e.yaw, e.pitch, e.roll);
  G.enemies.push(e);
  G.waveSpawned++;
  trace('spawn', `#${G.waveSpawned}/${G.waveTotal} @${x.toFixed(0)},${alt.toFixed(0)},${z.toFixed(0)}`);
  return e;
}

// --------------------------------------------------------------- lock-on ----
function collectTargets() {
  const out = [];
  for (const e of G.enemies) if (!e.dead) out.push(e);
  for (const g of G.ground) if (!g.dead) out.push(g);
  return out;
}

function targetConcealed(t) {
  if (!t || t.isGround) return false;
  return G.map.cloudDensity(t.pos.x, t.pos.y + 1, t.pos.z) > 0.28;
}

function updateLockOn(dt) {
  const p = G.player;
  const L = G.lock;
  if (!p || p.dead || G.mode !== 'play') {
    L.target = null; L.progress = 0; L.phase = 'search';
    return;
  }
  const aim = G.view === 0 ? { x: INPUT.mx, y: INPUT.my } : { x: VW * 0.5, y: VH * 0.5 };
  const radius = G.view === 0 ? 92 : 74;
  let best = null, bestScore = 1e9;
  const tmp = {};
  for (const t of collectTargets()) {
    const d = vdist(p.pos, t.pos);
    if (d > 2700 || d < 25) continue;
    const dir = vnorm(vsub(t.pos, p.pos));
    if (vdot(dir, p.basis.fwd) < 0.25) continue;
    if (targetConcealed(t)) continue;
    if (!projectToScreen({ x: t.pos.x, y: t.pos.y + (t.isGround ? 2 : 1.5), z: t.pos.z }, tmp)) continue;
    if (tmp.x < -20 || tmp.x > VW + 20 || tmp.y < -20 || tmp.y > VH + 20) continue;
    const dx = tmp.x - aim.x, dy = tmp.y - aim.y;
    const d2 = dx * dx + dy * dy;
    if (d2 > radius * radius) continue;
    // keep the current target unless it is clearly worse (hysteresis)
    let score = d2 + d * 0.01;
    if (L.target === t) score -= radius * radius * 0.6;
    if (score < bestScore) {
      if (L.target !== t) {
        // line of sight only checked for potential acquisitions
        if (!lineOfSightClear(p.pos, t.pos, 10)) continue;
      }
      best = t; bestScore = score;
    }
  }
  if (best !== L.target) {
    L.target = best;
    L.progress = best ? 0 : Math.max(0, L.progress - dt * 4);
  }
  if (L.target) {
    if (L.target.dead) { L.target = null; L.progress = 0; L.phase = 'search'; return; }
    const t = L.target;
    // break if the target slips out of the cone or is concealed
    const d = vdist(p.pos, t.pos);
    const dir = vnorm(vsub(t.pos, p.pos));
    const off = projectToScreen({ x: t.pos.x, y: t.pos.y + 1.5, z: t.pos.z }, tmp);
    const far = !off || Math.hypot(tmp.x - aim.x, tmp.y - aim.y) > radius * 1.34;
    if (d > 2900 || vdot(dir, p.basis.fwd) < 0.12 || far || targetConcealed(t)) {
      L.progress = Math.max(0, L.progress - dt * 3.5);
      L.phase = L.progress > 0.01 ? 'locking' : 'search';
      if (L.progress <= 0) L.target = null;
    } else {
      const prev = L.progress;
      L.progress += dt / LOCK_TIME;
      L.phase = L.progress >= 1 ? 'locked' : 'locking';
      if (L.progress >= 1 && prev < 1) {
        AudioSys.lockTone();
        G.flash = Math.max(G.flash, 0.08);
      }
      if (L.progress < 1) {
        L.tick -= dt;
        if (L.tick <= 0) {
          L.tick = 0.13 - L.progress * 0.06;
          AudioSys.lockTick(L.progress);
        }
      }
    }
  } else {
    L.phase = 'search';
    L.progress = Math.max(0, L.progress - dt * 4);
  }
  L.progress = clamp01(L.progress);
}

// --------------------------------------------------------------- 机炮 -------
function updatePlayerGuns(dt) {
  const p = G.player;
  if (!p || p.dead) return;
  p.gunCd = Math.max(0, p.gunCd - dt);
  if (INPUT.left || INPUT.keys.has('KeyF') || INPUT.touchGun) firePlayerGuns();
}

function firePlayerGuns() {
  const p = G.player;
  if (!p || p.dead || G.mode !== 'play' || p.gunCd > 1e-6) return;
  p.gunCd = GUN_INTERVAL;
  G.stats.shots++;
  const b = p.basis;
  const origin = vadd(p.pos, vmul(b.fwd, 6));
  let distance = GUN_RANGE, target = null;
  for (const t of collectTargets()) {
    const offset = vsub(targetAimPoint(t), origin);
    const along = vdot(offset, b.fwd);
    const radius = (t.radius || 7) + 3;
    const side2 = vdot(offset, offset) - along * along;
    if (side2 > radius * radius || along < 0) continue;
    const entry = Math.max(0, along - Math.sqrt(Math.max(0, radius * radius - side2)));
    if (entry < distance) { distance = entry; target = t; }
  }
  // 沿射线检查山体，不能隔着地形命中敌机。
  const steps = Math.max(1, Math.ceil(distance / 12));
  for (let i = 0; i <= steps; i++) {
    const d = distance * i / steps;
    const point = vadd(origin, vmul(b.fwd, d));
    if (point.y <= Math.max(0, G.map.heightAt(point.x, point.z)) + 1) {
      distance = d; target = null;
      spawnSparks(point, 2, '#d4a16a');
      break;
    }
  }
  const end = vadd(origin, vmul(b.fwd, distance));
  addTracer(origin, end, '#f2c270', 1);
  spawnBurst(origin, 2, '#e9ae56', 3, 0.06);
  if (target) {
    if (target.isGround) hitGround(target, GUN_DAMAGE, end);
    else hitDrone(target, GUN_DAMAGE, end);
  }
  AudioSys.gunshot(0.7);
}

// --------------------------------------------------------------- missiles ---
function makeMissileOwnerRef(owner) { return owner; }

function spawnPlayerMissile() {
  const p = G.player;
  const t = G.lock.phase === 'locked' ? G.lock.target : null;
  const b = p.basis;
  const side = (p.railFlip = !p.railFlip ? 1 : -1);
  const lateral = side > 0 ? 3.55 : -3.0;
  const origin = vadd(vadd(p.pos, vmul(b.right, lateral)), vadd(vmul(b.up, -0.45), vmul(b.fwd, 1.8)));
  const dir = vnorm(b.fwd);
  const speed = p.speed + 35;
  const m = {
    owner: 'player', kind: 'player',
    pos: origin, vel: vmul(dir, speed), speed,
    target: t, alive: true, dead: false,
    life: 6.5, age: 0, turnRate: 2.9,
    smokeTimer: 0, trailTimer: 0,
    lost: false, lostTimer: 0,
    offset: { x: rr(-0.6, 0.6), y: rr(-0.3, 0.3), z: rr(-0.6, 0.6) },
    hitRadius: 20, damage: 130,
    surface: null, smokeBig: false,
  };
  G.missiles.push(m);
  G.stats.shots++;
  spawnBurst(origin, 6, '#ffd08a', 14);
  for (let i = 0; i < 2; i++) {
    addSmoke(vadd(origin, { x: rr(-1.5, 1.5), y: rr(-1.5, 1.5), z: rr(-1.5, 1.5) }), rr(0.9, 1.8), 0.45, true, 1.2);
  }
  addShake(0.18);
  G.flash = Math.max(G.flash, 0.1);
  AudioSys.launch();
}

function firePlayerMissile() {
  const p = G.player;
  if (!p || p.dead || G.mode !== 'play') return;
  if (p.missiles <= 0) {
    AudioSys.tone(180, 0.05, 'square', 0.03);
    return;
  }
  p.missiles--;
  p.reloads.push(MISSILE_RELOAD);
  spawnPlayerMissile();
}

function spawnEnemyMissile(origin, aimedAt, source) {
  const p = G.player;
  const targetPos = aimedAt || p.pos;
  const dir = vnorm(vsub(targetPos, origin));
  const wave = G.wave || 1;
  const speed = Math.min(230, 150 + wave * 6) * 0.55;
  const m = {
    owner: 'enemy', kind: 'enemy',
    pos: vcopy(origin), vel: vmul(dir, speed), speed,
    target: p, dead: false,
    life: 9.5, age: 0, turnRate: 1.05,
    smokeTimer: 0, trailTimer: 0,
    lost: false, lostTimer: 0, decoy: false,
    damage: 30 + Math.min(14, wave * 1.4),
    hitRadius: 12, source,
    smokeBig: true,
  };
  G.missiles.push(m);
  for (let i = 0; i < 2; i++) addSmoke(vadd(origin, { x: rr(-2, 2), y: rr(-1.5, 1.5), z: rr(-2, 2) }), rr(1.2, 2.2), 0.5, true, 1.5);
  const d = vdist(origin, G.player.pos);
  if (d < 1700) AudioSys.launch();
  return m;
}

function rotateTowards(a, b, maxAngle) {
  const d = clamp(vdot(a, b), -1, 1);
  const ang = Math.acos(d);
  if (ang <= maxAngle || ang < 1e-5) return vcopy(b);
  let axis = vcross(a, b);
  // 完全反向时叉积为零，选稳定正交轴，仍按转速上限逐步转弯。
  if (vlen(axis) < 1e-6) axis = vcross(a, Math.abs(a.y) < 0.9 ? { x: 0, y: 1, z: 0 } : { x: 1, y: 0, z: 0 });
  axis = vnorm(axis);
  const c = Math.cos(maxAngle), s = Math.sin(maxAngle);
  const dotv = vdot(axis, a);
  return {
    x: a.x * c + (axis.y * a.z - axis.z * a.y) * s + axis.x * dotv * (1 - c),
    y: a.y * c + (axis.z * a.x - axis.x * a.z) * s + axis.y * dotv * (1 - c),
    z: a.z * c + (axis.x * a.y - axis.y * a.x) * s + axis.z * dotv * (1 - c),
  };
}

function targetAimPoint(t) {
  if (!t) return null;
  const y = t.isGround ? t.pos.y + 2.2 : t.pos.y + 0.8;
  return { x: t.pos.x, y, z: t.pos.z };
}

function missilePassesNear(from, to, point, radius) {
  const step = vsub(to, from), offset = vsub(point, from);
  const t = clamp(vdot(offset, step) / (vdot(step, step) || 1), 0, 1);
  return vdist(vmad(from, step, t), point) < radius;
}

function updateMissiles(dt) {
  const p = G.player;
  for (const m of G.missiles) {
    if (m.dead) continue;
    m.age += dt;
    m.life -= dt;
    if (m.life <= 0) { m.dead = true; continue; }
    let desired = null;
    if (m.owner === 'player') {
      if (m.target && !m.target.dead) {
        if (m.target.isGround) {
          if (G.map.cloudDensity(m.target.pos.x, m.target.pos.y + 1, m.target.pos.z) > 0.4 && rng() < dt * 2) { m.lost = true; }
        }
        if (!m.lost) desired = targetAimPoint(m.target);
      } else {
        m.target = null;
      }
      m.speed = Math.min(325, m.speed + 110 * dt);
    } else {
      // enemy missile
      if (m.lost) {
        m.lostTimer -= dt;
        if (m.lostTimer <= 0) { m.dead = true; spawnExplosion(m.pos, 0.3, 'air', { smoke: 2 }); continue; }
      } else if (p && !p.dead) {
        if (p.invuln > 0.25 && vdist(m.pos, p.pos) < 32) {
          m.lost = true; m.lostTimer = 0.7;
        }
        const conceal = G.map.cloudDensity(p.pos.x, p.pos.y, p.pos.z);
        const concealChance = (conceal > 0.28 ? 0.55 : 0) + (p.agl < 42 ? 0.2 : 0) + (p.skimming ? 0.25 : 0);
        if (concealChance > 0 && rng() < concealChance * dt * 1.8) {
          m.lost = true; m.lostTimer = 1.0;
        }
        if (m.decoy && rng() < dt * 3) { m.lost = true; m.lostTimer = 0.5; }
        if (!m.lost) {
          const lead = vadd(p.pos, vmul(p.basis.fwd, p.speed * 0.35));
          desired = lead;
        }
      }
      m.speed = Math.min(m.speed + 22 * dt, 250);
    }
    if (desired) {
      const dir = vnorm(m.vel);
      const want = vnorm(vsub(desired, m.pos));
      const nd = rotateTowards(dir, want, m.turnRate * dt);
      m.vel = vmul(nd, m.speed);
    } else {
      m.vel = vmul(vnorm(m.vel), m.speed);
    }
    const previousPos = vcopy(m.pos);
    m.pos.x += m.vel.x * dt;
    m.pos.y += m.vel.y * dt;
    m.pos.z += m.vel.z * dt;

    // trail
    m.smokeTimer -= dt;
    if (m.smokeTimer <= 0) {
      m.smokeTimer = m.smokeBig ? 0.022 : 0.03;
      addSmoke(m.pos, m.smokeBig ? rr(1.5, 3.0) : rr(0.8, 1.7), m.smokeBig ? 1.5 : 0.95, true, m.smokeBig ? 2.2 : 1.5);
      if (m.owner === 'player' && Math.random() < 0.5) spawnBurst(m.pos, 1, '#ffcf8a', 3, 0.15);
    }

    // terrain impact
    const gh = G.map.heightAt(m.pos.x, m.pos.z);
    if (m.pos.y <= Math.max(gh, 0) + 1.0) {
      m.dead = true;
      const water = gh < 0;
      const point = { x: m.pos.x, y: Math.max(gh, 0) + 0.5, z: m.pos.z };
      spawnExplosion(point, m.owner === 'player' ? 1.1 : 0.9, water ? 'water' : 'ground');
      if (m.owner === 'player') detonatePlayerMissile(m, point);
      else if (p && !p.dead && vdist(point, p.pos) < 35 && !m.lost) damagePlayer(m.damage * 0.5, 'missile');
      AudioSys.explosion(0.6, false);
      addShake(0.2);
      continue;
    }

    // proximity / target hit
    if (m.owner === 'player') {
      let hit = false;
      if (m.target && !m.target.dead) {
        const aim = targetAimPoint(m.target);
        if (missilePassesNear(previousPos, m.pos, aim, m.hitRadius + (m.target.isGround ? 8 : 4))) {
          hit = true;
          detonatePlayerMissile(m, aim);
        }
      } else {
        // proximity fuse on any target
        for (const t of collectTargets()) {
          const ap = targetAimPoint(t);
          if (missilePassesNear(previousPos, m.pos, ap, 16)) { m.target = t; hit = true; detonatePlayerMissile(m, ap); break; }
        }
      }
      if (hit) { m.dead = true; continue; }
    } else {
      if (p && !p.dead && missilePassesNear(previousPos, m.pos, p.pos, m.hitRadius)) {
        m.dead = true;
        const wasInvuln = p.invuln > 0.2;
        if (!wasInvuln) {
          damagePlayer(m.damage, 'missile');
          spawnExplosion(p.pos, 0.9, 'air', { player: true });
          G.flash = 0.5;
        } else {
          spawnExplosion(m.pos, 0.45, 'air', { smoke: 4 });
        }
        continue;
      }
    }
  }
  G.missiles = G.missiles.filter(m => !m.dead);
}

function detonatePlayerMissile(m, point) {
  const water = G.map.heightAt(point.x, point.z) < 0;
  const kind = water ? 'water' : (point.y < G.map.heightAt(point.x, point.z) + 30 ? 'ground' : 'air');
  spawnExplosion(point, 1.25, kind);
  AudioSys.explosion(1, false);
  addShake(0.32);
  G.flash = Math.max(G.flash, 0.18);
  G.hitStop = Math.max(G.hitStop, 0.02);
  // splash damage
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (vdist(e.pos, point) < 34) hitDrone(e, m.damage, point);
  }
  for (const g of G.ground) {
    if (g.dead) continue;
    if (vdist(g.pos, point) < 38) hitGround(g, m.damage, point);
  }
}

function hitDrone(e, dmg, at) {
  if (!e || e.dead) return;
  G.stats.hits++;
  e.hp -= dmg;
  if (e.hp <= 0) {
    e.dead = true;
    e.state = 'dead';
    const kind = G.map.heightAt(e.pos.x, e.pos.z) < 0 ? 'water' : (e.pos.y < G.map.heightAt(e.pos.x, e.pos.z) + 40 ? 'ground' : 'air');
    spawnExplosion(e.pos, 1.15, kind === 'air' ? 'air' : kind, { drone: true });
    for (let i = 0; i < 3; i++) {
      spawnDebris(vadd(e.pos, { x: rr(-4, 4), y: rr(-3, 3), z: rr(-4, 4) }), vmul(e.basis ? e.basis.fwd : { x: 0, y: 0, z: -1 }, e.speed * 0.5));
    }
    awardKill('drone', e.pos);
    trace('killDrone', `${G.waveKills}/${G.waveTotal} @${e.pos.x.toFixed(0)},${e.pos.y.toFixed(0)},${e.pos.z.toFixed(0)}`);
    AudioSys.explosion(1, true);
    addShake(0.7);
    G.flash = Math.max(G.flash, 0.3);
    G.hitStop = Math.max(G.hitStop, 0.06);
    if (G.lock.target === e) { G.lock.target = null; G.lock.progress = 0; G.lock.phase = 'search'; }
  } else {
    spawnSparks(at || e.pos, 5, '#ffb37a');
  }
}

function hitGround(g, dmg, at) {
  if (!g || g.dead) return;
  G.stats.hits++;
  g.hp -= dmg;
  if (g.hp <= 0) {
    g.dead = true;
    const water = G.map.heightAt(g.pos.x, g.pos.z) < 0;
    spawnExplosion(g.pos, 1.35, water ? 'water' : 'ground');
    addScorch({ x: g.pos.x, y: g.pos.y, z: g.pos.z }, g.type === 'sam' ? 26 : 18);
    awardKill(g.type, g.pos);
    AudioSys.explosion(1, true);
    addShake(0.55);
    if (G.lock.target === g) { G.lock.target = null; G.lock.progress = 0; G.lock.phase = 'search'; }
  } else {
    spawnSparks(at || g.pos, 4, '#ffcf8a');
  }
}

// --------------------------------------------------------------- enemies ----
function playerExposureFactor(p) {
  let f = 1;
  if (p.agl < 55) f *= 0.34;
  else if (p.agl < 140) f *= 0.7;
  if (p.inCloud > 0.3) f *= 0.22;
  else if (p.inCloud > 0.14) f *= 0.55;
  if (p.skimming) f *= 0.65;
  return f;
}

function enemyDetectsPlayer(e, p, dt, detectRange) {
  const d = vdist(e.pos, p.pos);
  if (d > detectRange) return false;
  const dir = vnorm(vsub(p.pos, e.pos));
  const fwd = e.basis.fwd;
  if (vdot(dir, fwd) < Math.cos(1.35)) return false;
  // sun glare: player close to the sun from the drone's point of view
  const sunBlind = vdot(dir, SUN_DIR) > 0.92;
  if (sunBlind && rng() < 0.55) return false;
  e.losTimer -= dt;
  if (e.losTimer <= 0) {
    e.losTimer = 0.25;
    e.los = lineOfSightClear(e.pos, p.pos, 11);
  }
  return e.los;
}

function steerDrone(e, desired, dt) {
  const dx = desired.x - e.pos.x, dy = desired.y - e.pos.y, dz = desired.z - e.pos.z;
  const horiz = Math.hypot(dx, dz) || 1;
  const targetYaw = Math.atan2(dx, -dz);
  const targetPitch = clamp(Math.atan2(dy, horiz), -0.72, 0.72);
  let dyaw = wrapAngle(targetYaw - e.yaw);
  const maxYaw = 1.25 * dt;
  e.yaw = wrapAngle(e.yaw + clamp(dyaw, -maxYaw, maxYaw));
  const dp = targetPitch - e.pitch;
  e.pitch = clamp(e.pitch + clamp(dp, -0.9 * dt, 0.9 * dt), -0.8, 0.8);
  const targetRoll = clamp(-dyaw * 1.3, -1.0, 1.0);
  e.roll = angleLerp(e.roll, targetRoll, 1 - Math.exp(-4 * dt));
  e.basis = basisFrom(e.yaw, e.pitch, e.roll);
}

function updateEnemies(dt) {
  const p = G.player;
  const mode = G.mode;
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.age += dt;
    if (!p) continue;
    const dist = vdist(e.pos, p.pos);
    const detectRange = 1500 + G.wave * 55;
    const exposure = playerExposureFactor(p);
    if (mode === 'play' && !e.leaving) {
      if (enemyDetectsPlayer(e, p, dt, detectRange * exposure)) {
        e.aware = 4.2;
        if (e.state !== 'engage' && e.state !== 'flee') e.state = 'engage';
      } else {
        e.aware -= dt;
      }
    }
    // state / energy
    if (e.state === 'flee') {
      e.fleeT -= dt;
      e.energy = Math.min(100, e.energy + 16 * dt);
      if (e.fleeT <= 0) e.state = e.aware > 0 ? 'engage' : 'patrol';
    } else if (e.state === 'engage') {
      e.energy = Math.max(0, e.energy - 5.5 * dt);
      if (e.energy < 12) { e.state = 'flee'; e.fleeT = 4.5; }
      if (e.aware <= 0) e.state = 'patrol';
    } else {
      e.energy = Math.min(100, e.energy + 9 * dt);
      if (e.aware > 0 && mode === 'play') e.state = 'engage';
    }
    // anchor follows the player so patrols stay in the fight
    if (dist > 3000) {
      const ang = rr(0, TAU);
      e.anchor = {
        x: p.pos.x + Math.sin(ang) * rr(800, 1600),
        y: Math.max(G.map.heightAt(p.pos.x + Math.sin(ang) * 1200, p.pos.z - Math.cos(ang) * 1200) + 200, Math.min(p.pos.y, CLOUD_BASE - 160)),
        z: p.pos.z - Math.cos(ang) * rr(800, 1600)
      };
    }
    let desired = null;
    let speedTarget = 110;
    if (e.leaving) {
      desired = vadd(e.pos, vmul(e.basis.fwd, 1500));
      desired.y = Math.max(desired.y, G.map.heightAt(desired.x, desired.z) + 500);
      speedTarget = 150;
    } else if (e.state === 'engage' && mode === 'play') {
      const lead = vadd(p.pos, vmul(p.basis.fwd, clamp(dist / 260, 0.4, 2.4) * 0.55));
      if (dist < 420) {
        const away = vnorm(vsub(e.pos, p.pos));
        desired = vadd(vadd(p.pos, vmul(away, 850)), { x: 0, y: 90, z: 0 });
      } else {
        desired = { x: lead.x, y: lead.y + 35, z: lead.z };
      }
      speedTarget = e.energy > 24 ? 152 : 112;
      e.energy = Math.max(0, e.energy - 5.2 * dt);
    } else if (e.state === 'flee') {
      const away = vnorm(vsub(e.pos, p.pos));
      desired = vadd(vadd(e.pos, vmul(away, 1200)), { x: 0, y: 80, z: 0 });
      speedTarget = 168;
    } else {
      // orbit patrol
      e.orbit += e.orbitSpeed * dt;
      const r = 420;
      desired = {
        x: e.anchor.x + Math.cos(e.orbit) * r,
        y: e.anchor.y + Math.sin(e.orbit * 0.7) * 50,
        z: e.anchor.z + Math.sin(e.orbit) * r
      };
      speedTarget = 108;
    }
    const ghHere = G.map.heightAt(e.pos.x, e.pos.z);
    if (!e.leaving) desired.y = Math.min(desired.y, Math.max(p.pos.y + 180, CLOUD_BASE - 140));
    if (desired.y < ghHere + 180) desired.y = ghHere + 180;
    // look-ahead terrain avoidance
    const ahead = vadd(e.pos, vmul(e.basis.fwd, 280));
    const ghAhead = G.map.heightAt(ahead.x, ahead.z);
    if (ghAhead > e.pos.y - 55) {
      desired.y = Math.max(desired.y, ghAhead + 260);
      e.pitch = Math.max(e.pitch, 0.16);
    }
    steerDrone(e, desired, dt);
    e.speed = damp(e.speed, speedTarget, 1.4, dt);
    const f = e.basis.fwd;
    e.pos.x += f.x * e.speed * dt;
    e.pos.y += f.y * e.speed * dt;
    e.pos.z += f.z * e.speed * dt;

    // hard terrain floor — never clip
    const gh = G.map.heightAt(e.pos.x, e.pos.z);
    const floor = Math.max(gh, 0) + 48;
    if (e.pos.y < floor) {
      e.pos.y = floor;
      e.pitch = Math.max(e.pitch, 0.18);
      e.yaw += clamp(wrapAngle(Math.atan2(e.pos.x - p.pos.x, -(e.pos.z - p.pos.z)) - e.yaw), -0.5, 0.5) * 0.3;
    }
    if (e.pos.y > 2200) e.pitch = Math.min(e.pitch, 0);

    // attacks
    if (mode === 'play' && !e.leaving && e.state === 'engage' && vdist(e.pos, p.pos) < 2600) {
      const toP = vnorm(vsub(p.pos, e.pos));
      const aimOk = vdot(toP, e.basis.fwd) > 0.55;
      e.missileCd -= dt;
      if (e.missileCd <= 0 && dist > 420 && dist < 2100 && aimOk && G.missiles.filter(m => m.owner === 'enemy' && m.source === e).length < 2 && G.missiles.filter(m => m.owner === 'enemy').length < 7) {
        e.missileCd = Math.max(3.2, 8.5 - G.wave * 0.35) + rr(0, 2.5);
        const origin = vadd(vadd(e.pos, vmul(e.basis.fwd, 2.5)), vmul(e.basis.up, -1.4));
        spawnEnemyMissile(origin, p.pos, e);
      }
      e.gunCd -= dt;
      if (dist < 520 && aimOk && e.gunCd <= 0) {
        e.gunCd = 1.05 + rr(0, 0.5);
        fireDroneGuns(e, p, dist);
      }
    }
    // separation from other drones
    for (const o of G.enemies) {
      if (o === e || o.dead) continue;
      const d = vdist(o.pos, e.pos);
      if (d < 55 && d > 0.01) {
        const push = vmul(vnorm(vsub(e.pos, o.pos)), (55 - d) * 0.6);
        e.pos = vadd(e.pos, push);
      }
    }
    // ram damage if it somehow happens
    if (dist < 20 && !p.dead && mode === 'play') damagePlayer(18, 'ram');
  }
  // remove exploded drones after their debris has flown (they stay as corpses? immediately removable)
  const removed = G.enemies.filter(e => e.dead).length;
  if (removed) trace('removeDrones', removed);
  G.enemies = G.enemies.filter(e => !e.dead);
}

function fireDroneGuns(e, p, dist) {
  const muzzle = vadd(vadd(e.pos, vmul(e.basis.fwd, 5.0)), vmul(e.basis.right, rr(-1.5, 1.5)));
  const conceal = playerExposureFactor(p);
  const invuln = p.invuln > 0.2;
  let hitChance = clamp(0.42 - dist / 1600, 0.05, 0.4) * (conceal > 0.6 ? 0.75 : 0.35);
  if (invuln) hitChance = 0;
  const tracers = 4;
  for (let i = 0; i < tracers; i++) {
    const t = 0.35 + i * 0.06;
    const target = vadd(p.pos, { x: rr(-12, 12), y: rr(-8, 8), z: rr(-12, 12) });
    const end = vlerp(muzzle, target, t + 0.12);
    addTracer(muzzle, end, '#ffca8a', 2);
    addTracer(muzzle, vlerp(muzzle, end, 0.65), '#fff0c8', 1);
  }
  spawnBurst(muzzle, 2, '#ffd9a0', 6, 0.18);
  if (Math.random() < hitChance) {
    const dmg = 3.2 + Math.min(4, G.wave * 0.35);
    damagePlayer(dmg, 'guns');
    spawnSparks(p.pos, 3, '#ffbf80');
    addTracer(muzzle, p.pos, '#fff5cf', 1);
  }
  if (dist < 900) AudioSys.gunshot(clamp(1 - dist / 1400, 0.1, 1));
}

// ---------------------------------------------------------- ground targets ---
function updateGround(dt) {
  const p = G.player;
  for (const g of G.ground) {
    if (g.dead) continue;
    if (g.type === 'sam') {
      if (p) {
        const desiredYaw = Math.atan2(p.pos.x - g.pos.x, -(p.pos.z - g.pos.z));
        g.yaw = angleLerp(g.yaw, desiredYaw, 1 - Math.exp(-0.8 * dt));
      }
      if (G.mode !== 'play' || !p || p.dead) continue;
      const d = vdist(g.pos, p.pos);
      g.fireCd -= dt;
      const conceal = playerExposureFactor(p);
      const masked = conceal < 0.4;
      const los = lineOfSightClear(g.pos, p.pos, 12);
      if (g.fireCd <= 0 && d < 2300 && d > 160 && !masked && los) {
        const active = G.missiles.filter(m => m.owner === 'enemy' && m.source === g).length;
        if (active < 2 && G.missiles.filter(m => m.owner === 'enemy').length < 8) {
          g.fireCd = Math.max(4.2, 9.5 - G.wave * 0.4) + rr(0, 2.0);
          g.flashT = 0.3;
          const origin = { x: g.pos.x + Math.sin(g.yaw) * 1.2, y: g.pos.y + 7.5, z: g.pos.z - Math.cos(g.yaw) * 1.2 };
          spawnEnemyMissile(origin, p.pos, g);
          for (let i = 0; i < 4; i++) addSmoke(vadd(origin, { x: rr(-3, 3), y: rr(-1, 2), z: rr(-3, 3) }), rr(4, 8), 1.2, true);
          addTracer(origin, vadd(origin, { x: 0, y: 25, z: 0 }), '#ffd27a', 2);
        }
      }
      if (g.flashT > 0) g.flashT -= dt;
    }
  }
}

// ---------------------------------------------------------------- effects ---
function capEffects() {
  while (G.effects.length > 820) G.effects.shift();
}
function addSmoke(pos, size, life, dark = false, growth = null) {
  G.effects.push({
    type: 'smoke', pos: vcopy(pos), vel: { x: rr(-2, 2), y: rr(1, 5), z: rr(-2, 2) },
    life, maxLife: life, size, growth: growth === null ? rr(3, 10) : growth, dark,
    drift: rr(0, TAU)
  });
  capEffects();
}
function spawnBurst(pos, n, color, speed = 25, life = 0.35) {
  for (let i = 0; i < n; i++) {
    G.effects.push({
      type: 'spark', pos: vcopy(pos),
      vel: { x: rr(-speed, speed), y: rr(-speed * 0.6, speed), z: rr(-speed, speed) },
      life: rr(life * 0.5, life), maxLife: life, size: rr(0.7, 1.8), color, gravity: 12
    });
  }
  capEffects();
}
function spawnSparks(pos, n, color) { spawnBurst(pos, n, color, 32, 0.5); }
function spawnDebris(pos, baseVel) {
  G.effects.push({
    type: 'debris', pos: vcopy(pos),
    vel: vadd(vmul(baseVel || { x: 0, y: 0, z: 0 }, 0.25), { x: rr(-28, 28), y: rr(-18, 26), z: rr(-28, 28) }),
    life: rr(1.0, 1.9), maxLife: 1.9, size: rr(1.2, 2.8), color: pick(['#6e6874', '#4b4654', '#8d3a32', '#2e2932']),
    gravity: 24, rot: rr(0, TAU), rotV: rr(-8, 8)
  });
  capEffects();
}
function addTracer(a, b, color, width = 1) {
  G.tracers.push({ a: vcopy(a), b: vcopy(b), color, width, life: 0.09, maxLife: 0.09 });
  if (G.tracers.length > 120) G.tracers.shift();
}
function addWingTrail(pos, side, strong = false) {
  G.vapor.push({ pos: vcopy(pos), side, life: strong ? 0.7 : 0.45, maxLife: strong ? 0.7 : 0.45, size: strong ? 1.8 : 1.1 });
  if (G.vapor.length > 260) G.vapor.shift();
}
function spawnSpray(pos) {
  for (let i = 0; i < 3; i++) {
    G.effects.push({
      type: 'spray', pos: vadd(pos, { x: rr(-6, 6), y: rr(0, 2), z: rr(-6, 6) }),
      vel: { x: rr(-32, 32), y: rr(16, 48), z: rr(-32, 32) },
      life: rr(0.5, 1.2), maxLife: 1.2, size: rr(1, 2.6), color: '#e9f7ef', gravity: 55
    });
  }
  if (Math.random() < 0.5) {
    G.effects.push({
      type: 'foam', pos: { x: pos.x + rr(-12, 12), y: 0.3, z: pos.z + rr(-12, 12) },
      vel: { x: 0, y: 0, z: 0 }, life: 1.1, maxLife: 1.1, size: rr(4, 10), color: '#dff3e8'
    });
  }
  capEffects();
}
function spawnFlare(pos, vel) {
  G.effects.push({
    type: 'flare', pos: vcopy(pos), vel: vadd(vel, { x: rr(-25, 25), y: rr(-8, 12), z: rr(-25, 25) }),
    life: 2.4, maxLife: 2.4, size: 1.6, color: '#fff1b8', gravity: 12, smokeT: 0
  });
  capEffects();
}
function spawnExplosion(pos, scale = 1, kind = 'air', opts = {}) {
  const delay = opts.delay || 0;
  const s = scale;
  const at = vcopy(pos);
  if (kind === 'water') {
    for (let i = 0; i < 18 * s; i++) {
      G.effects.push({
        type: 'spray', pos: { x: at.x + rr(-5, 5), y: at.y + rr(0, 2), z: at.z + rr(-5, 5) },
        vel: { x: rr(-22, 22), y: rr(40, 110) * s, z: rr(-22, 22) },
        life: rr(0.7, 1.6), maxLife: 1.6, size: rr(1.5, 4), color: '#effaf2', gravity: 70, delay
      });
    }
    G.effects.push({ type: 'ring', pos: at, vel: { x: 0, y: 0, z: 0 }, life: 0.75, maxLife: 0.75,
      size: 8 * s, growth: 55 * s, color: '#d7efe4', flat: true, delay });
    G.effects.push({ type: 'mist', pos: at, vel: { x: 0, y: 9, z: 0 }, life: 1.5, maxLife: 1.5, size: 8 * s, growth: 18, dark: false, delay });
    for (let i = 0; i < 6; i++) addSmoke({ x: at.x + rr(-8, 8), y: at.y + rr(2, 14), z: at.z + rr(-8, 8) }, rr(4, 8) * s, 1.5, false);
    G.effects.push({ type: 'foam', pos: { x: at.x, y: 0.5, z: at.z }, vel: { x: 0, y: 0, z: 0 }, life: 2.2, maxLife: 2.2, size: 8 * s, growth: 18 * s, color: '#e6f6ec', delay });
  } else if (kind === 'ground') {
    G.effects.push({ type: 'fire', pos: at, vel: { x: 0, y: 6, z: 0 }, life: 0.45, maxLife: 0.45, size: 7 * s, growth: 16 * s, color: '#ffd06a', delay });
    for (let i = 0; i < 7; i++) addSmoke({ x: at.x + rr(-6, 6), y: at.y + rr(1, 8), z: at.z + rr(-6, 6) }, rr(4, 10) * s, rr(1.4, 2.8), true);
    for (let i = 0; i < 14; i++) {
      G.effects.push({
        type: 'ember', pos: { x: at.x + rr(-5, 5), y: at.y + rr(0, 3), z: at.z + rr(-5, 5) },
        vel: { x: rr(-25, 25), y: rr(18, 55), z: rr(-25, 25) },
        life: rr(0.5, 1.4), maxLife: 1.4, size: rr(0.8, 1.8), color: pick(['#ffca6a', '#ff8a4a', '#ffe7ae']), gravity: 28, delay
      });
    }
    G.effects.push({ type: 'ring', pos: at, vel: { x: 0, y: 0, z: 0 }, life: 0.5, maxLife: 0.5,
      size: 5 * s, growth: 40 * s, color: '#e5cfa8', flat: true, delay });
    addScorch(at, 18 * s);
    for (let i = 0; i < 5; i++) addSmoke({ x: at.x + rr(-10, 10), y: at.y + rr(4, 12), z: at.z + rr(-10, 10) }, rr(6, 14), 2.5, true);
  } else {
    // air burst
    G.effects.push({ type: 'fire', pos: at, vel: { x: 0, y: 3, z: 0 }, life: 0.5, maxLife: 0.5, size: 9 * s, growth: 30 * s, color: '#fff2c8', delay });
    G.effects.push({ type: 'fire', pos: vadd(at, { x: rr(-3, 3), y: rr(-3, 3), z: rr(-3, 3) }), vel: { x: 0, y: 2, z: 0 }, life: 0.72, maxLife: 0.72, size: 6 * s, growth: 34 * s, color: '#ffab4e', delay });
    G.effects.push({ type: 'ring', pos: at, vel: { x: 0, y: 0, z: 0 }, life: 0.5, maxLife: 0.5,
      size: 6 * s, growth: 85 * s, color: '#fff3d2', delay });
    for (let i = 0; i < 16 * s; i++) {
      G.effects.push({
        type: 'spark', pos: vcopy(at),
        vel: { x: rr(-80, 80) * s, y: rr(-45, 90) * s, z: rr(-80, 80) * s },
        life: rr(0.4, 1.2), maxLife: 1.2, size: rr(0.8, 2.2), color: pick(['#fff6dc', '#ffd16a', '#ff8f4a']),
        gravity: 22, delay
      });
    }
    for (let i = 0; i < 6; i++) addSmoke({ x: at.x + rr(-6, 6), y: at.y + rr(-4, 6), z: at.z + rr(-6, 6) }, rr(6, 14) * s, rr(1.2, 2.8), true);
    if (opts.smoke) {
      for (let i = 0; i < opts.smoke; i++) addSmoke({ x: at.x + rr(-8, 8), y: at.y + rr(-5, 8), z: at.z + rr(-8, 8) }, rr(5, 14), rr(1.5, 3.2), true);
    }
  }
  if (opts.delay) {
    // delayed bursts simply schedule the same effect set; delay is baked into particles above
  }
  capEffects();
}
function addScorch(pos, size) {
  G.decals.push({ pos: vcopy(pos), size, life: 26, maxLife: 26 });
  if (G.decals.length > 26) G.decals.shift();
}

function updateEffects(dt) {
  for (let i = G.effects.length - 1; i >= 0; i--) {
    const f = G.effects[i];
    if (f.delay > 0) { f.delay -= dt; continue; }
    f.life -= dt;
    if (f.life <= 0) { G.effects.splice(i, 1); continue; }
    if (f.vel) {
      if (f.gravity) f.vel.y -= f.gravity * dt;
      const drag = f.type === 'spark' ? 0.94 : 0.985;
      f.vel.x *= drag; f.vel.z *= drag;
      if (f.type === 'smoke' || f.type === 'mist') f.vel.y *= 0.995;
      f.pos.x += f.vel.x * dt; f.pos.y += f.vel.y * dt; f.pos.z += f.vel.z * dt;
    }
    if (f.growth) f.size += f.growth * dt;
    if (f.type === 'flare') {
      f.smokeT -= dt;
      if (f.smokeT <= 0) { f.smokeT = 0.12; addSmoke(f.pos, rr(1, 2.4), 0.8, true); }
    }
    if (f.type === 'smoke' || f.type === 'mist') {
      const gh = G.map.heightAt(f.pos.x, f.pos.z);
      if (f.pos.y < gh + 1) { f.pos.y = gh + 1; f.vel.y = Math.abs(f.vel.y) * 0.2; }
    }
    if (f.type === 'ember' && f.pos.y < G.map.heightAt(f.pos.x, f.pos.z) + 0.5) { f.life = Math.min(f.life, 0.15); }
  }
  for (let i = G.tracers.length - 1; i >= 0; i--) {
    G.tracers[i].life -= dt;
    if (G.tracers[i].life <= 0) G.tracers.splice(i, 1);
  }
  for (let i = G.decals.length - 1; i >= 0; i--) {
    G.decals[i].life -= dt;
    if (G.decals[i].life <= 0) G.decals.splice(i, 1);
  }
  for (const p of G.popups) { p.t += dt; p.pos.y += dt * 6; }
  G.popups = G.popups.filter(p => p.t < p.life);
}

function updateVapor(dt) {
  for (let i = G.vapor.length - 1; i >= 0; i--) {
    const v = G.vapor[i];
    v.life -= dt;
    if (v.life <= 0) G.vapor.splice(i, 1);
  }
}


// ===== 50_ui_hud.js =====
// ---------------------------------------------------------------------------
// UI: world-space overlay, HUD, pixel cockpit.
// All coordinates are in logical VW x 340 space and are drawn with hard pixels.
// ---------------------------------------------------------------------------
const RADAR = { canvas: null, rctx: null, lastT: -10, lastX: 1e9, lastZ: 1e9 };

function addHit(x, y, w, h, onDown, onUp) {
  INPUT.uiHits.push({ x, y, w, h, onDown, onUp });
}

function panel(x, y, w, h, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.alpha === undefined ? 0.82 : o.alpha);
  ctx.fillStyle = o.fill || 'rgba(15,12,24,0.92)';
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  if (o.border !== false) {
    ctx.strokeStyle = o.stroke || '#6a5743';
    ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w) - 1, Math.round(h) - 1);
  }
  if (o.corners) {
    const c = o.corners === true ? (o.stroke || '#d5a955') : o.corners;
    ctx.fillStyle = c;
    const s = 3;
    ctx.fillRect(Math.round(x), Math.round(y), s, 1);
    ctx.fillRect(Math.round(x), Math.round(y), 1, s);
    ctx.fillRect(Math.round(x + w - s), Math.round(y), s, 1);
    ctx.fillRect(Math.round(x + w - 1), Math.round(y), 1, s);
    ctx.fillRect(Math.round(x), Math.round(y + h - 1), s, 1);
    ctx.fillRect(Math.round(x), Math.round(y + h - s), 1, s);
    ctx.fillRect(Math.round(x + w - s), Math.round(y + h - 1), s, 1);
    ctx.fillRect(Math.round(x + w - 1), Math.round(y + h - s), 1, s);
  }
  ctx.restore();
}

function segBar(x, y, w, h, frac, color, bg = '#2a2030', segs = 20) {
  frac = clamp01(frac);
  rect(x, y, w, h, bg);
  rectLine(x, y, w, h, '#0b0912', 0.9);
  const on = Math.round(frac * segs);
  for (let i = 0; i < on; i++) {
    const sx = x + 1 + Math.floor(i * (w - 2) / segs);
    const sw = Math.max(1, Math.floor((w - 2) / segs) - (segs > 12 ? 1 : 0));
    rect(sx, y + 1, sw, h - 2, color);
  }
}

function drawButton(x, y, w, h, label, onDown, o = {}) {
  const hover = INPUT.mx >= x && INPUT.mx < x + w && INPUT.my >= y && INPUT.my < y + h;
  const fill = o.danger ? '#3a1718' : (hover ? '#3a3042' : '#201a2a');
  const stroke = o.danger ? '#ff6f5e' : (hover ? '#ffd67a' : '#8a6f47');
  panel(x, y, w, h, { fill, stroke, alpha: o.alpha === undefined ? 0.94 : o.alpha, corners: true });
  drawText(label, x + w / 2, y + h / 2 + (o.size || 8) / 2 - 1, {
    size: o.size || 8, color: o.color || PAL.cream, align: 'center',
    spacing: o.spacing || 0, bold: o.bold
  });
  if (o.sub) drawText(o.sub, x + w / 2, y + h - 3, { size: 5, color: '#b09a72', align: 'center' });
  if (onDown) addHit(x, y, w, h, onDown, o.onUp);
}

// 8x15 mini missile silhouette for the weapon bar / title strip
function drawMissilePip(x, y, ready, loadFrac = 0) {
  rect(x, y, 8, 15, '#171220');
  rectLine(x, y, 8, 15, ready ? '#d5a955' : '#4b4052');
  const body = ready ? '#e5c273' : '#4a4050';
  const nose = ready ? '#e0664f' : '#5a3038';
  const fin = ready ? '#b59a55' : '#3c3444';
  // seeker cone
  rect(x + 3, y + 1, 2, 1, nose);
  rect(x + 2, y + 2, 4, 1, nose);
  // airframe + highlight
  rect(x + 2, y + 3, 4, 6, body);
  rect(x + 3, y + 3, 1, 5, ready ? '#fff0bb' : '#5a5060');
  // tail fins
  rect(x + 1, y + 9, 1, 2, fin);
  rect(x + 6, y + 9, 1, 2, fin);
  rect(x + 2, y + 9, 1, 1, fin);
  rect(x + 5, y + 9, 1, 1, fin);
  if (ready) {
    rect(x + 3, y + 11, 2, 2, '#ff9a3d');
    rect(x + 3, y + 13, 1, 1, '#fff0bb');
  } else if (loadFrac > 0) {
    const fh = Math.round(10 * clamp01(loadFrac));
    rect(x + 2, y + 14 - fh, 4, fh, '#5a4a2a');
  }
}

function drawMousePip(mx, my, color = PAL.paleCyan) {
  ctx.save();
  ctx.globalAlpha = 0.9;
  const x = Math.round(mx), y = Math.round(my);
  ctx.fillStyle = '#0b0912';
  ctx.fillRect(x - 1, y - 1, 3, 3);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, 1, 1);
  ctx.globalAlpha = 0.55;
  ctx.fillRect(x - 4, y, 2, 1); ctx.fillRect(x + 3, y, 2, 1);
  ctx.fillRect(x, y - 4, 1, 2); ctx.fillRect(x, y + 3, 1, 2);
  ctx.restore();
}

// --------------------------------------------------------- world overlay ----
function pxPerM(dist) { return screenPixelPerMetre(dist); }

function shadowVisible(ground) {
  if (!G.player) return true;
  // approximate: if clouds sit between the aircraft and its shadow, skip it
  const mid = vlerp(G.player.pos, ground, 0.5);
  return G.map.cloudDensity(mid.x, mid.y, mid.z) < 0.22;
}

function drawGroundShadow(pos, basis, size, alpha = 0.35) {
  if (!G.map) return;
  const gh = G.map.heightAt(pos.x, pos.z);
  if (gh > pos.y - 8) return;
  const ground = { x: pos.x, y: Math.max(gh, 0) + 0.4, z: pos.z };
  if (!shadowVisible(ground)) return;
  const s = {};
  if (!projectToScreen(ground, s) || !s.visible) return;
  const p2 = { x: ground.x + basis.fwd.x * 20, y: ground.y, z: ground.z + basis.fwd.z * 20 };
  const s2 = {};
  if (!projectToScreen(p2, s2)) return;
  const ang = Math.atan2(s2.y - s.y, s2.x - s.x);
  const ppm = pxPerM(s.dist);
  const w = Math.max(2, 11 * size * ppm);
  const h = Math.max(1, 4.6 * size * ppm);
  const altFade = clamp01(1 - (pos.y - ground.y) / 1800);
  ctx.save();
  ctx.globalAlpha = alpha * altFade;
  ctx.translate(Math.round(s.x), Math.round(s.y));
  ctx.rotate(ang);
  ctx.fillStyle = 'rgba(10,7,16,0.9)';
  ctx.beginPath();
  ctx.ellipse(0, 0, w * 0.5, h * 0.5, 0, 0, TAU);
  ctx.fill();
  ctx.globalAlpha *= 0.7;
  ctx.fillRect(-w * 0.24, -h * 0.08, w * 0.55, Math.max(1, h * 0.16));
  ctx.restore();
}

function drawScorchDecals() {
  for (const d of G.decals) {
    const s = {};
    const pos = { x: d.pos.x, y: d.pos.y + 0.5, z: d.pos.z };
    if (!projectToScreen(pos, s) || !s.visible) continue;
    const ppm = pxPerM(s.dist);
    const r = Math.max(1.5, d.size * ppm);
    const a = clamp01(d.life / d.maxLife);
    ctx.save();
    ctx.globalAlpha = 0.5 * a;
    ctx.fillStyle = '#1b1218';
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), r, r * 0.45, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.35 * a;
    ctx.fillStyle = '#0c080d';
    ctx.beginPath(); ctx.ellipse(Math.round(s.x), Math.round(s.y), r * 0.6, r * 0.28, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawVaporPoints() {
  for (const v of G.vapor) {
    const s = {};
    if (!projectToScreen(v.pos, s) || !s.visible) continue;
    const a = clamp01(v.life / v.maxLife);
    const ppm = pxPerM(s.dist);
    const r = Math.max(0.6, v.size * ppm);
    ctx.globalAlpha = a * 0.34;
    ctx.fillStyle = '#e8f1f4';
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTracers() {
  for (const t of G.tracers) {
    const a = {}, b = {};
    if (!projectToScreen(t.a, a) || !projectToScreen(t.b, b)) continue;
    if (a.w < 0 || b.w < 0) continue;
    const alpha = clamp01(t.life / t.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#241407';
    ctx.lineWidth = (t.width || 1) + 2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = t.color;
    ctx.lineWidth = t.width || 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    if (t.width > 1) {
      ctx.strokeStyle = '#fff6da';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(lerp(a.x, b.x, 0.7), lerp(a.y, b.y, 0.7)); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawEffects() {
  const tmp = {};
  // smoke belongs behind the fireball and sparks, not on top of them
  const smokeRank = f => (f.type === 'smoke' || f.type === 'mist') ? 0 : 1;
  G.effects.sort((a, b) => smokeRank(a) - smokeRank(b));
  for (const f of G.effects) {
    if (f.delay > 0) continue;
    const b = projectToScreen(f.pos, tmp);
    if (!b || !tmp.visible) continue;
    const ppm = pxPerM(tmp.dist);
    const lifeF = clamp01(f.life / f.maxLife);
    const x = Math.round(tmp.x), y = Math.round(tmp.y);
    if (f.type === 'smoke' || f.type === 'mist') {
      // cap screen-space radius so launch puffs next to the camera can never
      // smear across the view; fade very near puffs instead of blowing up
      const cap = f.type === 'mist' ? 60 : (f.dark ? 38 : 46);
      const r = Math.min(cap, Math.max(0.8, f.size * ppm));
      const near = clamp01((tmp.dist - 16) / 55);
      const a = (f.type === 'mist' ? 0.32 : 0.5) * lifeF * (0.22 + 0.78 * near);
      if (a < 0.01) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = f.type === 'mist' ? '#c9c3cf' : (f.dark ? '#34303e' : '#777080');
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.globalAlpha = a * 0.55;
      ctx.fillStyle = f.dark ? '#17131e' : '#a49aa6';
      ctx.beginPath(); ctx.arc(x - r * 0.22, y - r * 0.18, r * 0.62, 0, TAU); ctx.fill();
    } else if (f.type === 'fire') {
      const r = Math.max(1, f.size * ppm);
      const a = clamp01(lifeF * 1.3);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ff7a3a';
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(x - r * 0.12, y - r * 0.15, r * 0.68, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff6dc';
      ctx.beginPath(); ctx.arc(x - r * 0.2, y - r * 0.22, r * 0.36, 0, TAU); ctx.fill();
      // chunky embers at the rim
      ctx.fillStyle = '#ffb348';
      for (let i = 0; i < 4; i++) {
        const ang = i * 1.9 + lifeF;
        ctx.fillRect(Math.round(x + Math.cos(ang) * r * 1.1), Math.round(y + Math.sin(ang) * r * 1.1), 1, 1);
      }
    } else if (f.type === 'spark' || f.type === 'ember') {
      const a = clamp01(lifeF * 1.6);
      const sz = Math.max(1, Math.round(f.size * (f.type === 'spark' ? 1 : 1)));
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color;
      ctx.fillRect(x, y, sz, sz);
      ctx.globalAlpha = a * 0.35;
      ctx.fillStyle = '#ffb35a';
      ctx.fillRect(x - 1, y, sz + 2, 1);
    } else if (f.type === 'spray') {
      const a = clamp01(lifeF);
      const sz = Math.max(1, Math.round(f.size * 0.8));
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = f.color;
      ctx.fillRect(x, y, sz, sz);
      ctx.globalAlpha = a * 0.45;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y - 1, 1, 1);
    } else if (f.type === 'foam') {
      const r = Math.max(1, f.size * ppm);
      ctx.globalAlpha = 0.35 * lifeF;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.35, 0, 0, TAU); ctx.stroke();
    } else if (f.type === 'ring') {
      const r = Math.max(1, f.size * ppm);
      ctx.globalAlpha = clamp01(lifeF * 1.4) * 0.9;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = f.flat ? 1 : 2;
      ctx.beginPath();
      if (f.flat) ctx.ellipse(x, y, r, r * 0.38, 0, 0, TAU);
      else ctx.arc(x, y, r, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha *= 0.5;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (f.flat) ctx.ellipse(x, y, r * 1.06, r * 0.40, 0, 0, TAU);
      else ctx.arc(x, y, r * 1.05, 0, TAU);
      ctx.stroke();
    } else if (f.type === 'debris') {
      const a = clamp01(lifeF);
      const sz = Math.max(1, f.size * ppm * 1.8);
      ctx.globalAlpha = a;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(f.rot || 0);
      ctx.fillStyle = f.color;
      ctx.fillRect(-sz * 0.5, -sz * 0.5, sz, Math.max(1, sz * 0.6));
      ctx.restore();
      f.rot = (f.rot || 0) + (f.rotV || 0) * 0.016;
    } else if (f.type === 'flare') {
      ctx.globalAlpha = 0.95 * lifeF;
      ctx.fillStyle = '#fff6c9';
      ctx.fillRect(x - 1, y - 1, 3, 3);
      ctx.globalAlpha = 0.5 * lifeF;
      ctx.fillStyle = '#ffb84d';
      ctx.fillRect(x - 3, y, 7, 1);
      ctx.fillRect(x, y - 3, 1, 7);
    }
  }
  ctx.globalAlpha = 1;
}

// hard-pixel line: no anti-aliasing, every stamp lands on an integer pixel
function pixelLine(x0, y0, x1, y1, color, thick = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0);
  x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  const o = (thick - 1) >> 1;
  ctx.fillStyle = color;
  for (let guard = 0; guard < 400; guard++) {
    ctx.fillRect(x0 - o, y0 - o, thick, thick);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

function drawMissilesAndGlows() {
  const tmp = {}, t2 = {};
  for (const m of G.missiles) {
    if (m.dead) continue;
    if (!projectToScreen(m.pos, tmp) || !tmp.visible) continue;
    const sp = Math.hypot(m.vel.x, m.vel.y, m.vel.z) || 1;
    const ux = m.vel.x / sp, uy = m.vel.y / sp, uz = m.vel.z / sp;
    // project a point behind the round so the sprite follows screen velocity
    const back = { x: m.pos.x - ux * 8, y: m.pos.y - uy * 8, z: m.pos.z - uz * 8 };
    if (!projectToScreen(back, t2)) continue;
    let dx = tmp.x - t2.x, dy = tmp.y - t2.y;
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    const ppm = pxPerM(tmp.dist);
    // stylised size floor keeps the missile readable at combat ranges
    const len = clamp(Math.round(4.2 * ppm * 2.2), 9, 22);
    const x = tmp.x, y = tmp.y;
    const nx = x + dx * len * 0.62, ny = y + dy * len * 0.62;
    const tx = x - dx * len * 0.38, ty = y - dy * len * 0.38;
    const px = -dy, py = dx;
    const enemy = m.owner === 'enemy';
    const bodyCol = enemy ? '#d9c9b6' : '#efe8d4';
    const finCol = enemy ? '#6e2f2a' : '#8e929c';
    const noseCol = enemy ? '#ff5d47' : '#c24534';
    const flameCol = enemy ? '#ff8a3d' : '#ffc46a';
    const flick = 0.75 + 0.25 * Math.sin(G.realTime * 40 + (m.age || 0) * 7);
    const flameLen = (4 + len * 0.55) * flick;
    const ex = tx - dx * flameLen, ey = ty - dy * flameLen;
    const thick = 2;
    const fs = Math.max(2, len * 0.16);
    // dark underlay keeps the missile legible over snow and cloud
    pixelLine(ex, ey, nx, ny, '#0b0912', thick + 1);
    // swept tail fins
    pixelLine(tx - dx * 2 + px * fs, ty - dy * 2 + py * fs, tx + px * (fs + 1.4), ty + py * (fs + 1.4), finCol, 1);
    pixelLine(tx - dx * 2 - px * fs, ty - dy * 2 - py * fs, tx - px * (fs + 1.4), ty - py * (fs + 1.4), finCol, 1);
    // body + red seeker
    pixelLine(tx, ty, nx, ny, bodyCol, thick);
    pixelLine(lerp(tx, nx, 0.76), lerp(ty, ny, 0.76), nx, ny, noseCol, thick);
    // exhaust flame with a white-hot core
    pixelLine(ex, ey, tx, ty, flameCol, thick);
    pixelLine(lerp(ex, tx, 0.35), lerp(ey, ty, 0.35), tx, ty, '#fff3c8', 1);
    ctx.save();
    const qx = Math.round(tx), qy = Math.round(ty);
    // soft exhaust bloom, still blocky
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = flameCol;
    ctx.fillRect(qx - 3, qy - 1, 7, 3);
    ctx.fillRect(qx - 1, qy - 3, 3, 7);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#fff6d8';
    ctx.fillRect(qx - 1, qy - 1, 2, 2);
    ctx.globalAlpha = 0.35;
    ctx.fillRect(Math.round(ex) - 1, Math.round(ey) - 1, 3, 3);
    ctx.restore();
  }
  // engine glows
  const p = G.player;
  if (!p) return;
  if (G.cockpitAlpha < 0.6) {
    const b = p.renderBasis;
    for (const side of [-1.25, 1.25]) {
      const nozzle = vadd(vadd(p.pos, vmul(b.right, side)), vmul(b.fwd, -4.3));
      if (!projectToScreen(nozzle, tmp) || !tmp.visible) continue;
      const glow = p.burning ? 3 : 2;
      ctx.save();
      ctx.globalAlpha = p.burning ? 0.9 : 0.62;
      const x = Math.round(tmp.x), y = Math.round(tmp.y);
      ctx.fillStyle = '#ff9a42';
      ctx.fillRect(x - Math.round(glow), y - Math.round(glow * 0.55), Math.round(glow * 2), Math.round(glow * 1.1));
      ctx.fillStyle = '#ffe7b0';
      ctx.fillRect(x - 1, y - 1, 2, 2);
      const tail = vsub(nozzle, vmul(b.fwd, p.burning ? 6.5 : 0.75));
      const t2 = {};
      if (projectToScreen(tail, t2)) {
        const dx = t2.x - x, dy = t2.y - y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const w = clamp(0.55 + 5 / Math.max(6, vdist(nozzle, G.camera.pos)), 0.7, 2.4);
        ctx.globalAlpha = p.burning ? 0.62 : 0.3;
        ctx.fillStyle = p.burning ? '#8fdcff' : '#ff9a45';
        ctx.beginPath();
        ctx.moveTo(x + nx * w, y + ny * w);
        ctx.lineTo(t2.x, t2.y);
        ctx.lineTo(x - nx * w, y - ny * w);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = p.burning ? 0.85 : 0.5;
        ctx.fillStyle = '#fff1c8';
        ctx.beginPath();
        ctx.moveTo(x + nx * 0.7, y + ny * 0.7);
        ctx.lineTo(lerp(x, t2.x, 0.55), lerp(y, t2.y, 0.55));
        ctx.lineTo(x - nx * 0.7, y - ny * 0.7);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (!projectToScreen(vadd(e.pos, vmul(e.basis.fwd, -4.3)), tmp) || !tmp.visible) continue;
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#ff5a3c';
    ctx.fillRect(Math.round(tmp.x) - 1, Math.round(tmp.y) - 1, 3, 2);
    ctx.fillStyle = '#ffc08a';
    ctx.fillRect(Math.round(tmp.x), Math.round(tmp.y), 1, 1);
    ctx.restore();
  }
}

function drawPopups() {
  for (const p of G.popups) {
    const s = {};
    if (!projectToScreen(p.pos, s) || !s.visible) continue;
    const a = Math.min(1, (p.life - p.t) * 2.2) * Math.min(1, p.t * 8 + 0.2);
    drawText(p.text, s.x, s.y, {
      size: 9, color: p.color, align: 'center', alpha: a,
      outline: '#100b14', bold: true
    });
    if (p.tag) drawText(p.tag, s.x, s.y - 11, {
      size: 9, color: '#ffe8b0', align: 'center', alpha: a,
      outline: '#100b14', spacing: 0
    });
  }
}

function drawWorldOverlay() {
  if (!G.map || !G.player) return;
  ctx.save();
  // shadows
  for (const g of G.ground) {
    if (g.dead) continue;
    const d = vdist(g.pos, G.player.pos);
    if (d > 2600) continue;
    drawGroundShadow(g.pos, { fwd: { x: 0, y: 0, z: -1 } }, g.type === 'sam' ? 0.8 : 0.55, 0.28);
  }
  for (const e of G.enemies) {
    if (e.dead) continue;
    const d = vdist(e.pos, G.player.pos);
    if (d > 2200) continue;
    drawGroundShadow(e.pos, e.basis, 0.5, 0.22);
  }
  if (G.cockpitAlpha < 0.65) drawGroundShadow(G.player.pos, G.player.renderBasis, 0.8, 0.3);
  drawScorchDecals();
  drawVaporPoints();
  drawTracers();
  drawEffects();
  drawMissilesAndGlows();
  drawPopups();
  ctx.restore();
}

// ---------------------------------------------------------------- HUD -------
function compassDeg(yaw) {
  let d = (yaw * 180 / Math.PI) % 360;
  if (d < 0) d += 360;
  return d;
}

function compassLabel(deg) {
  const names = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  return names[Math.round(deg / 45) % 8];
}

function drawHUD() {
  const p = G.player;
  if (!p || !G.camera) return;
  const cockpit = G.cockpitAlpha;
  drawPitchLadder(cockpit);
  drawHeadingTape();
  if (G.view === 0 && G.viewBlend > 0.55) drawTopPlayerIcon();
  // target boxes sit under the instrument panels so they never scribble
  // over the shield/fuel/score readouts
  drawTargetMarkers();
  drawObjectivesPanel();
  drawScorePanel();
  drawSpeedAlt();
  drawShieldFuel();
  drawAimReticle();
  drawThreats();
  if (cockpit < 0.45) {
    drawWeaponPips();
    drawMiniRadar();
  }
  drawWarnings();
  drawBanner();
  if ((G.mode === 'play' || G.mode === 'waveclear' || G.mode === 'dying') && (!INPUT.touchMode || TOUCH.active)) {
    drawMousePip(INPUT.mx, INPUT.my, cockpit > 0.5 ? '#b7e9df' : '#d8efe8');
  }
}

function drawPitchLadder(cockpitFade) {
  if (G.view === 0 && G.viewBlend > 0.5) return;
  const p = G.player;
  if (!p) return;
  const clipTop = 35;
  const clipBottom = cockpitFade > 0.35 ? VH - 104 : VH - 54;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, clipTop, VW, Math.max(10, clipBottom - clipTop));
  ctx.clip();
  const rightDir = { x: Math.cos(p.yaw), y: 0, z: Math.sin(p.yaw) };
  const pts = {};
  const tmp = {};
  for (let deg = -40; deg <= 40; deg += 10) {
    const a = deg * DEG;
    const dir = {
      x: Math.sin(p.yaw) * Math.cos(a),
      y: Math.sin(a),
      z: -Math.cos(p.yaw) * Math.cos(a)
    };
    const far = 1600;
    const half = 520;
    const c = vadd(p.pos, vmul(dir, far));
    const a1 = { x: c.x - rightDir.x * half, y: c.y, z: c.z - rightDir.z * half };
    const a2 = { x: c.x + rightDir.x * half, y: c.y, z: c.z + rightDir.z * half };
    const s1 = {}, s2 = {};
    if (!projectToScreen(a1, s1) || !projectToScreen(a2, s2)) continue;
    if (s1.w < 1 || s2.w < 1) continue;
    if (!s1.visible && !s2.visible) continue;
    const mx = (s1.x + s2.x) / 2, my = (s1.y + s2.y) / 2;
    if (my < clipTop - 20 || my > clipBottom + 20) continue;
    if (mx < -300 || mx > VW + 300) continue;
    const len = Math.hypot(s2.x - s1.x, s2.y - s1.y);
    if (len < 12) continue;
    const ux = (s2.x - s1.x) / len, uy = (s2.y - s1.y) / len;
    const halfLen = Math.min(len * 0.32, 90);
    const gap = deg === 0 ? 32 : 16;
    const isHorizon = deg === 0;
    const col = isHorizon ? 'rgba(240,192,90,0.95)' : 'rgba(173,235,225,0.62)';
    const width = isHorizon ? 2 : 1;
    if (len > gap * 2 + 8) {
      ctx.strokeStyle = 'rgba(8,6,12,0.85)';
      ctx.lineWidth = width + 1;
      ctx.beginPath();
      ctx.moveTo(mx - ux * (gap + halfLen), my - uy * (gap + halfLen));
      ctx.lineTo(mx - ux * gap, my - uy * gap);
      ctx.moveTo(mx + ux * gap, my + uy * gap);
      ctx.lineTo(mx + ux * (gap + halfLen), my + uy * (gap + halfLen));
      ctx.stroke();
      ctx.strokeStyle = col;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(mx - ux * (gap + halfLen), my - uy * (gap + halfLen));
      ctx.lineTo(mx - ux * gap, my - uy * gap);
      ctx.moveTo(mx + ux * gap, my + uy * gap);
      ctx.lineTo(mx + ux * (gap + halfLen), my + uy * (gap + halfLen));
      ctx.stroke();
    }
    if (deg !== 0) {
      const label = (deg > 0 ? '+' : '') + deg;
      drawText(label, mx - ux * (gap + halfLen) - 3, my - uy * (gap + halfLen) - 2, {
        size: 6, color: 'rgba(190,240,230,0.85)', align: 'right', shadow: 'rgba(8,6,12,0.8)'
      });
      drawText(label, mx + ux * (gap + halfLen) + 3, my + uy * (gap + halfLen) + 6, {
        size: 6, color: 'rgba(190,240,230,0.85)', align: 'left', shadow: 'rgba(8,6,12,0.8)'
      });
    } else {
      drawText('地平线', mx - ux * (gap + halfLen) - 3, my - uy * (gap + halfLen) - 3, {
        size: 8, color: 'rgba(240,192,90,0.8)', align: 'right', shadow: 'rgba(8,6,12,0.9)'
      });
    }
  }
  ctx.restore();
}

function drawHeadingTape() {
  const p = G.player;
  const deg = compassDeg(p.yaw);
  const w = 168, h = 15;
  const x = Math.round(VW / 2 - w / 2), y = 8;
  panel(x, y, w, h, { alpha: 0.68, fill: '#100d18', stroke: '#5d4c39', corners: false });
  ctx.save();
  ctx.beginPath(); ctx.rect(x + 1, y, w - 2, h); ctx.clip();
  const pxPerDeg = 2.3;
  for (let d = -36; d <= 36; d += 5) {
    const td = deg + d;
